name: Build APK

on:
  push:
    branches: [main, ccr-ae266e58-ytuhvz]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java kur (Capacitor 6 → JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tek dosya HTML'i üret (Three.js ve yazı tipi gömülür)
        run: npm run build && npm run check

      - name: Sabit imzalama anahtarını yerleştir (güncellemeler üst üste kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Android projesini oluştur (Capacitor)
        run: npx cap add android

      - name: Uygulama ikonunu oluştur
        run: npx capacitor-assets generate --android --iconBackgroundColor '#05080F' --iconBackgroundColorDark '#05080F' --splashBackgroundColor '#05080F' --splashBackgroundColorDark '#05080F'

      - name: Web dosyalarını senkronize et
        run: npx cap sync android

      - name: Sürüm numarası, izinler ve koyu tema
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "permission\|requestLegacy" android/app/src/main/AndroidManifest.xml
          sed -i 's/name="colorPrimaryDark">#[0-9A-Fa-f]*/name="colorPrimaryDark">#05080F/' android/app/src/main/res/values/styles.xml || true
          sed -i 's/name="colorPrimary">#[0-9A-Fa-f]*/name="colorPrimary">#05080F/' android/app/src/main/res/values/styles.xml || true
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK derle
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MIT-Holo-v2.0.${{ github.run_number }}.apk

      - name: APK dosyasını yükle (Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mit-holo-apk
          path: MIT-Holo-v2.0.${{ github.run_number }}.apk

      - name: Sürüm sayfasına yükle (telefondan kolay indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: MİT Holo v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: MIT-Holo-v2.0.${{ github.run_number }}.apk
          body: |
            MİT Holo (hologram küre arayüzü) — Android APK.
            Dal: ${{ github.ref_name }} · Commit: ${{ github.sha }}
