/* ---------- Yörünge oyunu ----------
   Bir menü düğümüne 2 sn basılı tut → düğüm yerinden kopar, parmakla çekilir.
   Bırakınca yaylanarak yerine döner; yolda başka bir düğüme çarparsa tüm
   düğümler yörüngeden çıkar, ekranda sekip birbirine çarpar ve toplam 3 sn
   içinde yörüngelerine geri döner. Hesap ekran (piksel) uzayında yapılır. */
var Orbit = {
  phase: 'idle', // idle | hold | grab | fly | chaos
  idx: -1, t: 0, timer: null, off: [], home: [], R: 30, CHAOS: 3, FREE: 1.5,
  last: null, px: 0, py: 0,
  init: function () {
    for (var i = 0; i < NODES.length; i++) { this.off.push({ x: 0, y: 0, vx: 0, vy: 0 }); this.home.push({ x: 0, y: 0 }); }
    var self = this, wrap = document.getElementById('nodes');
    wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    wrap.addEventListener('pointerdown', function (e) {
      var el = e.target.closest('.node');
      if (!el || self.phase !== 'idle' || Impact.active() || UI.panelOpen() || !Sphere.ok) return;
      var idx = Sphere.nodeEls.indexOf(el);
      if (idx < 0) return;
      self.phase = 'hold'; self.idx = idx; self.px = e.clientX; self.py = e.clientY; self.pid = e.pointerId;
      clearTimeout(self.timer);
      self.timer = setTimeout(function () {
        // 2 sn içinde parmak kaydıysa (küre çevrildiyse) iptal
        if (self.phase !== 'hold' || Sphere.moved) { self.phase = 'idle'; return; }
        self.phase = 'grab';
        Sphere.moved = true; // bırakınca menü açılmasın
        Sphere.vx = Sphere.vy = 0;
        Sphere.nodeEls[idx].classList.add('grabbed');
        self.last = { x: e.clientX, y: e.clientY, t: performance.now(), vx: 0, vy: 0 };
        haptic(40); Sound.play('open');
        UI.toast('Menüyü çek ve bırak');
      }, 2000);
    });
    var end = function (e) {
      if (e.pointerId !== self.pid) return;
      if (self.phase === 'hold') { clearTimeout(self.timer); self.phase = 'idle'; }
      else if (self.phase === 'grab') self.release();
    };
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  },
  active: function () { return this.phase === 'grab' || this.phase === 'fly' || this.phase === 'chaos'; },
  // Sphere'in pointermove'u çağırır; true dönerse küre dönmez
  move: function (e) {
    if (this.phase === 'hold' && e.pointerId === this.pid && Math.abs(e.clientX - this.px) + Math.abs(e.clientY - this.py) > 10) {
      clearTimeout(this.timer); this.phase = 'idle'; return false;
    }
    if (this.phase !== 'grab' || e.pointerId !== this.pid) return false;
    var o = this.off[this.idx], h = this.home[this.idx], now = performance.now(), L = this.last, dt = Math.max(1, now - L.t) / 1000;
    var nx = e.clientX - h.x, ny = e.clientY - h.y;
    L.vx = (nx - o.x) / dt * 0.6 + L.vx * 0.4; L.vy = (ny - o.y) / dt * 0.6 + L.vy * 0.4;
    o.x = nx; o.y = ny; L.t = now;
    return true;
  },
  release: function () {
    var o = this.off[this.idx];
    o.vx = Math.max(-1500, Math.min(1500, this.last.vx)); o.vy = Math.max(-1500, Math.min(1500, this.last.vy));
    Sphere.nodeEls[this.idx].classList.remove('grabbed');
    this.phase = 'fly'; this.t = 0;
    Sound.play('back');
  },
  pos: function (i) { return { x: this.home[i].x + this.off[i].x, y: this.home[i].y + this.off[i].y }; },
  step: function (dt) {
    if (this.phase === 'idle' || this.phase === 'hold' || this.phase === 'grab') return;
    this.t += dt;
    var self = this, n = this.off.length, W = window.innerWidth, H = window.innerHeight;
    if (this.phase === 'fly') {
      var o = this.off[this.idx];
      // Yay: hafif sönümlü, hedefi aşar (çarpma ihtimali yüksek)
      o.vx += (-55 * o.x - 2.2 * o.vx) * dt; o.vy += (-55 * o.y - 2.2 * o.vy) * dt;
      o.x += o.vx * dt; o.y += o.vy * dt;
      var p = this.pos(this.idx), sp = Math.hypot(o.vx, o.vy);
      for (var j = 0; j < n; j++) {
        if (j === this.idx) continue;
        var q = this.pos(j);
        if (Math.hypot(p.x - q.x, p.y - q.y) < this.R * 2 && sp > 180) { this.chaos(p.x, p.y); return; }
      }
      if (this.t > 2.5 || (Math.hypot(o.x, o.y) < 1 && sp < 5)) { o.x = o.y = o.vx = o.vy = 0; this.phase = 'idle'; }
      return;
    }
    // chaos
    var r = Math.max(0, (this.t - this.FREE) / (this.CHAOS - this.FREE));
    var k = 1.5 + r * r * 160;
    var c = 0.35 + r * 20;
    this.off.forEach(function (o, i) {
      o.vx += (-k * o.x - c * o.vx) * dt; o.vy += (-k * o.y - c * o.vy) * dt;
      o.x += o.vx * dt; o.y += o.vy * dt;
      // Ekran kenarından sekme (serbest uçuş süresince)
      if (self.t < self.FREE) {
        var p = self.pos(i), m = self.R + 4;
        if (p.x < m && o.vx < 0) { o.x += m - p.x; o.vx = -o.vx * 0.85; Orbit.bump(); }
        if (p.x > W - m && o.vx > 0) { o.x -= p.x - (W - m); o.vx = -o.vx * 0.85; Orbit.bump(); }
        if (p.y < m + 50 && o.vy < 0) { o.y += m + 50 - p.y; o.vy = -o.vy * 0.85; Orbit.bump(); }
        if (p.y > H - m && o.vy > 0) { o.y -= p.y - (H - m); o.vy = -o.vy * 0.85; Orbit.bump(); }
      }
    });
    // Düğümler birbirine çarpar (esnek)
    if (this.t < this.FREE + 0.4) {
      for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) {
        var pa = this.pos(a), pb = this.pos(b), dx = pb.x - pa.x, dy = pb.y - pa.y, d = Math.hypot(dx, dy) || 1;
        if (d < this.R * 2) {
          var nx = dx / d, ny = dy / d, ov = this.R * 2 - d, A = this.off[a], B = this.off[b];
          A.x -= nx * ov / 2; A.y -= ny * ov / 2; B.x += nx * ov / 2; B.y += ny * ov / 2;
          var rv = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          if (rv < 0) { A.vx += rv * nx; A.vy += rv * ny; B.vx -= rv * nx; B.vy -= rv * ny; if (-rv > 120) this.bump(); }
        }
      }
    }
    Sphere.wobble = Math.max(0, 1 - this.t / this.CHAOS);
    if (this.t >= this.CHAOS) {
      this.off.forEach(function (o) { o.x = o.y = o.vx = o.vy = 0; });
      this.phase = 'idle'; Sphere.wobble = 0;
      document.body.classList.remove('orbit-chaos');
      UI.toast('Yörünge düzeldi');
    } else if (this.t > this.FREE && !this.backMsg) { this.backMsg = true; UI.toast('Yörüngeye dönülüyor', 'info'); }
  },
  chaos: function (x, y) {
    var self = this;
    this.phase = 'chaos'; this.t = 0; this.backMsg = false;
    document.body.classList.add('orbit-chaos');
    var g = this.off[this.idx], gs = Math.hypot(g.vx, g.vy);
    this.off.forEach(function (o, i) {
      var p = self.pos(i), dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
      var power = (i === self.idx ? 0.6 : 1) * (380 + Math.random() * 420 + gs * 0.4) * (1 / (1 + d / 260));
      o.vx += dx / d * power + (Math.random() - 0.5) * 200;
      o.vy += dy / d * power + (Math.random() - 0.5) * 200;
    });
    Sphere.vy += 0.06 * (Math.random() < 0.5 ? -1 : 1); Sphere.vx += 0.03;
    Sphere.wobble = 1;
    var st = document.getElementById('stage');
    st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
    Impact.boomSound(0.5); fb('err'); haptic(40);
    UI.toast('Çarpışma! Yörünge bozuldu', 'err');
  },
  lastBump: 0,
  bump: function () {
    var now = performance.now();
    if (now - this.lastBump < 90) return;
    this.lastBump = now;
    if (Sound.ctx && Settings.sound) { try { Sound.tone(160 + Math.random() * 200, 0.08, 'triangle'); } catch (e) {} }
    haptic(10);
  },
  reset: function () {
    clearTimeout(this.timer);
    this.off.forEach(function (o) { o.x = o.y = o.vx = o.vy = 0; });
    if (this.idx >= 0 && Sphere.nodeEls[this.idx]) Sphere.nodeEls[this.idx].classList.remove('grabbed');
    this.phase = 'idle'; Sphere.wobble = 0;
    document.body.classList.remove('orbit-chaos');
  }
};

var UI = {
  layers: [], // { kind, el, onClose, canClose }
  useHistory: !IN_FRAME && !!(window.history && history.pushState),
  _silentPops: 0,

  panelOpen: function () { return this.layers.length > 0; },
  top: function () { return this.layers[this.layers.length - 1] || null; },

  /* Geçmiş yönetimi: katman varken tarihçede tek bir "koruma" kaydı tutulur.
     Geri tuşu bu kaydı tüketir → en üstteki katman kapanır → katman kaldıysa
     koruma yeniden eklenir. history.back() yalnızca son katman arayüzden

  dropGuard: function () {

  // Kullanıcı arayüzünden kapatma (geri düğmesi, kaydet vb.)

    if (!this.layers.length) return;

    if (!this.layers.length) this.dropGuard();
  },
  // Geri tuşu (popstate) geldiğinde
  onPopState: function () {
    if (this._silentPops > 0) { this._silentPops--; return; }
    this.guard = false;
    if (!this.layers.length) return;
    this._closeTop(true);
    if (this.layers.length) this.ensureGuard();
  },
  _closeTop: function (fromBack) {
    var l = this.top();
    if (!l) return;
    if (fromBack && l.canClose && !l.canClose()) return;

  },
  // Üstteki katmanı geçmiş kaydına dokunmadan başka bir katmanla değiştir

  },
  closeAll: function () {
    while (this.layers.length) {
      var l = this.layers.pop();

    this.dropGuard();
  },

  /* ---------- Hologram panel ---------- */

      '<div class="p-title hud" data-ptitle>' + (opts.title || '') + '</div><div class="p-actions" data-pactions></div></div>' +
      '<div class="p-body" data-pbody></div>';

        self.panel = null;

        if (opts.onClose) opts.onClose();

    });

  },
  pBody: function () { return this.panel ? this.panel.el.querySelector('[data-pbody]') : null; },

  },

  openSub: function (title, actionsHtml, bodyHtml, onClose) {

    this.push({ kind: 'sub', el: el, onClose: function () { if (el.parentNode) el.parentNode.removeChild(el); Sound.play('back'); onClose && onClose(); } });

  openSheet: function (opts) {

      self.pop();
    });

      kind: 'sheet', el: ov, canClose: opts.canClose,

  /* ---------- Çekmece: arama + alfabetik liste + onay kutuları ---------- */
  drawer: null,
  openDrawer: function (opts) {
    // opts: { title, items:[{id,name,thumb?}], multi, selected:[], newLabel, onNew, onDone(ids) }
    var d = { opts: opts, q: '', sel: (opts.selected || []).slice() };
    this.drawer = d;

      '<div class="drw-sel" data-drw-sel></div>' +
      '<div class="drw-search"><div style="position:relative"><span class="s-ic" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx2);display:flex">' + icon('search', 18) + '</span>' +
      '<input class="inp" style="padding-left:42px" data-in="drw-q" placeholder="Ara..." autocomplete="off" /></div></div>' +

  paintDrawer: function () {
    var d = this.drawer;
    if (!d) return;
    var o = d.opts, q = low(d.q).trim();
    var list = o.items.slice().sort(function (a, b) { return byName(a.name, b.name); });
    if (q) list = list.filter(function (it) { return low(it.name).indexOf(q) >= 0; });
    var html = '', letter = '';
    if (o.newLabel) html += '<button class="drw-row drw-new" data-act="drw-new"><span class="thumb">' + icon('plus', 20) + '</span><span class="nm">' + esc(o.newLabel) + '</span></button>';
    if (!o.items.length) html += '<p class="empty">' + esc(o.emptyText || 'Kayıt yok') + '</p>';
    else if (!list.length) html += '<p class="empty">Sonuç bulunamadı</p>';
    list.forEach(function (it) {
      var L = String(it.name || '?').charAt(0).toLocaleUpperCase('tr-TR');
      if (L !== letter) { letter = L; html += '<div class="drw-letter">' + esc(L) + '</div>'; }
      var on = d.sel.indexOf(it.id) >= 0;
      html += '<button class="drw-row' + (on ? ' sel' : '') + '" data-act="drw-pick" data-id="' + esc(it.id) + '">' +
        (it.thumb !== undefined ? '<span class="thumb">' + (it.thumb ? '<img src="' + it.thumb + '" alt="" />' : icon('tag', 18)) + '</span>' : '') +
        '<span class="nm">' + esc(it.name) + '</span>' +
        (o.multi ? '<span class="cbox">' + (on ? icon('check', 16) : '') + '</span>' : '') + '</button>';
    });
    var top = this.top();
    if (!top) return;
    top.el.querySelector('[data-drw-list]').innerHTML = html;
    var selEl = top.el.querySelector('[data-drw-sel]');
    if (o.multi) {
      selEl.innerHTML = d.sel.map(function (id) {
        var it = o.items.filter(function (x) { return x.id === id; })[0];
        return it ? '<button class="drw-chip" data-act="drw-unpick" data-id="' + esc(id) + '">' + esc(it.name) + '<i>×</i></button>' : '';
      }).join('');
    }
  },

  /* ---------- Toast ---------- */
  toast: function (text, type) {
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast' + (type === 'err' ? ' t-err' : type === 'info' ? ' t-info' : '');
    el.textContent = text;
    root.appendChild(el);
    if (type === 'err') fb('err');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, type === 'err' ? 3500 : 2200);
  },
  _undo: null,
  undoToast: function (text, onUndo) {
    var root = document.getElementById('toast-root');
    if (this._undo) { clearInterval(this._undo.timer); if (this._undo.el.parentNode) this._undo.el.parentNode.removeChild(this._undo.el); }
    var el = document.createElement('div');
    el.className = 'toast undo';
    var left = 5;
    el.innerHTML = '<span>' + esc(text) + '</span><button class="btn sm" data-act="undo">' + icon('undo', 16) + ' Geri Al (<b>5</b>)</button>';
    root.appendChild(el);
    var self = this;
    var u = { el: el, fn: onUndo };
    u.timer = setInterval(function () {
      left--;
      var b = el.querySelector('b'); if (b) b.textContent = String(left);
      if (left <= 0) self.clearUndo();
    }, 1000);
    this._undo = u;
  },
  clearUndo: function () {
    if (!this._undo) return;
    clearInterval(this._undo.timer);
    if (this._undo.el.parentNode) this._undo.el.parentNode.removeChild(this._undo.el);
    this._undo = null;
  },
  runUndo: function () {
    var u = this._undo;
    if (!u) return;
    this.clearUndo();
    u.fn();
  },

  /* ---------- Tehlikeli işlem: iki dokunuş ----------
     İlk dokunuş düğmeyi kırmızıya çevirir ("Silmek için tekrar dokun"),
     3 sn içinde ikinci dokunuş işlemi yapar. */
  armed: null,
  twoTap: function (btn, fn, armedText) {
    if (this.armed && this.armed.btn === btn) {
      clearTimeout(this.armed.timer);
      this.armed = null;
      btn.classList.remove('armed');
      fn();
      return;
    }
    this.disarm();
    var orig = btn.innerHTML;
    btn.classList.add('armed');
    btn.innerHTML = btn.classList.contains('ibtn') ? icon('trash', 20) : esc(armedText || 'Silmek için tekrar dokun');
    if (btn.classList.contains('ibtn')) this.toast(armedText || 'Silmek için tekrar dokun', 'info');
    haptic(25);
    var self = this;
    this.armed = { btn: btn, orig: orig, timer: setTimeout(function () { self.disarm(); }, 3000) };
  },
  disarm: function () {
    var a = this.armed;
    if (!a) return;
    clearTimeout(a.timer);
    a.btn.classList.remove('armed');
    a.btn.innerHTML = a.orig;
    this.armed = null;
  },

  /* ---------- Klavye ---------- */
  setupKeyboard: function () {
    function isText(el) {
      if (!el) return false;
      if (el.tagName === 'TEXTAREA') return true;
      return el.tagName === 'INPUT' && ['file', 'checkbox', 'radio', 'button'].indexOf(el.type) < 0;
    }
    var timer = null;
    document.addEventListener('focusin', function (e) {
      if (!isText(e.target)) return;
      document.body.classList.add('kb');
      clearTimeout(timer);
      var el = e.target;
      // Klavye yerleştikten 400 ms sonra alan görünmüyorsa tek bir kaydırma
      timer = setTimeout(function () {
        if (document.activeElement !== el) return;
        var r = el.getBoundingClientRect();
        var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        if (r.bottom > vh - 8 || r.top < 0) el.scrollIntoView({ block: 'center' });
      }, 400);
    });
    document.addEventListener('focusout', function (e) {
      if (!isText(e.target)) return;
      setTimeout(function () { if (!isText(document.activeElement)) document.body.classList.remove('kb'); }, 50);
    });
  }
};

/* ---------- Yetki devirli olay işleyicileri ----------
   Tüm tıklamalar data-act, yazma data-in, dosya seçimi data-ch, tuşlar data-key
   üzerinden tek noktadan yakalanır. Hata olursa tek cümlelik toast. */
var Actions = {}, Inputs = {}, Changes = {}, Keys = {}, Blurs = {};
function safeRun(fn, el, e) {
  try {
    var r = fn(el, e);
    if (r && typeof r.then === 'function') r.catch(function (err) { console.error(err); UI.toast('İşlem tamamlanamadı: ' + (err && err.message ? err.message : 'hata'), 'err'); });
  } catch (err) {
    console.error(err);
    UI.toast('İşlem tamamlanamadı: ' + (err && err.message ? err.message : 'hata'), 'err');
  }
}
function bindDelegates() {
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act');
    if (UI.armed && UI.armed.btn !== el) UI.disarm();
    var fn = Actions[act];
    if (!fn) return;
    if (act !== 'node') Sound.play('tap');
    safeRun(fn, el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-in]');
    if (el && Inputs[el.getAttribute('data-in')]) safeRun(Inputs[el.getAttribute('data-in')], el, e);
  });
  document.addEventListener('change', function (e) {
    var el = e.target.closest('[data-ch]');
    if (el && Changes[el.getAttribute('data-ch')]) safeRun(Changes[el.getAttribute('data-ch')], el, e);
  });
  document.addEventListener('keydown', function (e) {
    var el = e.target.closest && e.target.closest('[data-key]');
    if (el && Keys[el.getAttribute('data-key')]) safeRun(Keys[el.getAttribute('data-key')], el, e);
  });
  document.addEventListener('pointerdown', function () { Sound.unlock(); }, { passive: true });
  document.addEventListener('focusout', function (e) {
    var el = e.target.closest && e.target.closest('[data-blur]');
    if (el && Blurs[el.getAttribute('data-blur')]) safeRun(Blurs[el.getAttribute('data-blur')], el, e);
  });
}

Actions.back = function () { UI.pop(); };
Actions.undo = function () { UI.runUndo(); };
Actions['drw-pick'] = function (el) {
  var d = UI.drawer; if (!d) return;
  var id = el.getAttribute('data-id');
  if (!d.opts.multi) { var cb = d.opts.onDone; UI.pop(); cb([id]); return; }
  var i = d.sel.indexOf(id);
  if (i >= 0) d.sel.splice(i, 1); else d.sel.push(id);
  UI.paintDrawer();
};
Actions['drw-unpick'] = function (el) {
  var d = UI.drawer; if (!d) return;
  d.sel = d.sel.filter(function (x) { return x !== el.getAttribute('data-id'); });
  UI.paintDrawer();
};
Actions['drw-done'] = function () { var d = UI.drawer; if (!d) return; var ids = d.sel.slice(); UI.pop(); d.opts.onDone(ids); };
Actions['drw-new'] = function () { var d = UI.drawer; if (!d) return; var cb = d.opts.onNew; UI.pop(); cb && cb(); };
Inputs['drw-q'] = function (el) { if (UI.drawer) { UI.drawer.q = el.value; UI.paintDrawer(); } };

   Düğüm → panel: Aktif İşler · Müşteriler (+ müşteri detayı alt sayfası) ·

   İş formu, müşteri formu, iş özeti, fotoğraf görüntüleyici: alt sayfa.

var App = {
  booted: false,
  refreshStats: function () {
    var active = Data.activeJobs().length;
    var set = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; };
    // Merkez: içeride işi olan müşteri sayısı + baskı bekleyen / baskısı yapılan iş
    var actList = Data.activeJobs(), withJob = {}, waiting = 0, printed = 0;
    actList.forEach(function (x) { withJob[x.customer.id] = true; if (x.job.printed) printed++; else waiting++; });
    set('cs-big', String(Object.keys(withJob).length));
    set('cs-a', waiting + '<span>BASKI BEKLEYEN</span>');
    set('cs-b', printed + '<span>BASKISI YAPILAN</span>');
    var badges = {
      jobs: active, customers: Data.customers.length,
      patterns: Data.patterns.length, report: '', backup: '', settings: ''
    };
    Object.keys(badges).forEach(function (k) {
      var b = document.querySelector('[data-badge="' + k + '"]');
      if (b) b.textContent = badges[k] === '' || badges[k] === 0 ? '' : String(badges[k]);
    });
    if (Sphere.ok && !Sphere.running) Sphere.renderOnce();
  },
  openNode: function (id) {
    if (Sphere.busy || UI.panelOpen()) return;
    if (Sphere.moved || Orbit.active()) return;
    if (Impact.phase === 'scatter' || Impact.phase === 'gather') return; // sürükleme bitişi tıklama sayılmaz
    var idx = -1;
    NODES.forEach(function (n, i) { if (n.id === id) idx = i; });
    if (idx < 0) return;
    Sphere.busy = true;
    fb('open');
    Sphere.focus(idx).then(function () {
      Sphere.busy = false;
      Screens.open(id);
    });
  }
};
Actions.node = function (el) { App.openNode(el.getAttribute('data-id')); };

/* ---------- Rapor (haftalık / aylık) ---------- */
function reportRange(key) {
  var now = new Date();
  if (key === 'lastMonth') return { from: new Date(now.getFullYear(), now.getMonth() - 1, 1), to: new Date(now.getFullYear(), now.getMonth(), 1), label: 'Geçen Ay' };
  if (key === 'month') return { from: periodStart('month'), to: new Date(8.64e15), label: 'Bu Ay' };
  return { from: periodStart('week'), to: new Date(8.64e15), label: 'Bu Hafta' };
}
function buildReport(key) {
  var r = reportRange(key), inR = function (iso) { if (!iso) return false; var d = new Date(iso); return d >= r.from && d < r.to; };
  var rep = { label: r.label, from: r.from, meters: 0, mt: 0, kg: 0, rolls: 0, newJobs: 0, delivered: 0, customers: {}, patterns: {} };
  Data.customers.forEach(function (c) {
    c.jobs.forEach(function (j) {
      if (inR(j.deliveredAt)) rep.delivered++;
      if (!inR(j.createdAt)) return;
      rep.newJobs++;
      var t = calcJobTotals(j);
      rep.meters += t.grandTotalMeters; rep.mt += t.totalMeters; rep.kg += t.totalKg; rep.rolls += t.meterRolls.length + t.kgRolls.length;
      var cc = rep.customers[c.id] || (rep.customers[c.id] = { name: c.name, meters: 0, jobs: 0 });
      cc.meters += t.grandTotalMeters; cc.jobs++;
      j.patternGroups.forEach(function (g) {
        var gt = calcRollTotals(g.fabricRolls, j.fabricGramsPerMeter).grandTotalMeters;
        if (!gt) return;
        var n = (g.patternName || 'İsimsiz Kalıp').trim(), k = low(n);
        var pp = rep.patterns[k] || (rep.patterns[k] = { name: n, meters: 0 });
        pp.meters += gt;
      });
      var ut = calcRollTotals(j.unassignedRolls, j.fabricGramsPerMeter).grandTotalMeters;
      if (ut) { var u = rep.patterns['\u0000'] || (rep.patterns['\u0000'] = { name: 'Atanmamış toplar', meters: 0 }); u.meters += ut; }
    });
  });
  var sortM = function (o) { return Object.keys(o).map(function (k) { return o[k]; }).sort(function (a, b) { return b.meters - a.meters; }); };
  rep.customerList = sortM(rep.customers);
  rep.patternList = sortM(rep.patterns);
  return rep;
}
Screens.report = function (body) {
  var key = this.st.reportKey || 'week', rep = buildReport(key);
  UI.setHead('Rapor<small>' + rep.label + ' · ' + fmtDate(rep.from) + ' sonrası</small>',
    '<button class="ibtn" data-act="report-share" aria-label="Raporu paylaş">' + icon('share', 22) + '</button>');
  var tab = function (k, label) { var x = buildReport(k); return '<button class="tab' + (k === key ? ' on' : '') + '" data-act="report-tab" data-k="' + k + '"><b>' + fmtNum(Math.round(x.meters)) + '</b><span>' + label + '</span></button>'; };
  var bars = function (list, color) {
    if (!list.length) return '<p class="hint">Bu dönemde kayıt yok</p>';
    var max = list[0].meters || 1;
    return list.slice(0, 8).map(function (x) {
      return '<div style="margin:6px 0"><div class="between" style="font-size:15px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.name) + '</span><b style="color:' + color + ';white-space:nowrap">' + fmtNum(x.meters) + ' mt</b></div>' +
        '<div class="storage-bar" style="margin-top:4px"><i style="width:' + Math.max(2, x.meters / max * 100).toFixed(1) + '%;background:' + color + '"></i></div></div>';
    }).join('');
  };
  var tile = function (v, l, c) { return '<div class="blk" style="gap:2px;padding:12px"><b class="hud" style="font-size:22px;color:' + c + '">' + v + '</b><p style="font-size:13px">' + l + '</p></div>'; };
  body.innerHTML = '<div class="tabs">' + tab('week', 'mt · Bu Hafta') + tab('month', 'mt · Bu Ay') + tab('lastMonth', 'mt · Geçen Ay') + '</div>' +
    '<div class="grid2" style="margin-bottom:12px">' +
    tile(fmtNum(rep.meters), 'Toplam metraj (mt)', 'var(--cy)') + tile(rep.newJobs, 'Yeni iş', 'var(--am)') +
    tile(rep.delivered, 'Teslim edilen iş', 'var(--st-done)') + tile(rep.customerList.length, 'İş veren müşteri', 'var(--st-print)') + '</div>' +
    '<div class="stack"><div class="blk"><h3 class="hud">Müşterilere Göre</h3>' + bars(rep.customerList, 'var(--cy)') + '</div>' +
    '<div class="blk"><h3 class="hud">Kalıplara Göre</h3>' + bars(rep.patternList, 'var(--am)') + '</div>' +
    '<div class="blk"><h3 class="hud">Toplar</h3><p>' + rep.rolls + ' top · ' + fmtNum(rep.mt) + ' mt + ' + fmtNum(rep.kg) + ' kg</p>' +
    '<p class="hint">Metraj, dönem içinde açılan işlere göre hesaplanır; kilo topları gramajla metreye çevrilir.</p></div>' +
    '<button class="btn pri block" data-act="report-share">' + icon('share', 18) + ' Raporu Paylaş</button></div>';
};
Actions['report-tab'] = function (el) { Screens.st.reportKey = el.getAttribute('data-k'); Screens.report(UI.pBody()); };
Actions['report-share'] = function (el) {
  var rep = buildReport(Screens.st.reportKey || 'week');
  var lines = [{ t: 'MİT · ' + rep.label.toLocaleUpperCase('tr-TR') + ' RAPORU', s: 22, b: true, c: '#00E5FF', center: true, after: 6 },
    { t: fmtDate(rep.from) + ' – ' + fmtDate(new Date()), s: 15, c: '#8FB3C7', center: true, after: 16 },
    { t: 'Toplam metraj: ' + fmtNum(rep.meters) + ' mt', s: 20, b: true },

    { t: 'Toplar: ' + rep.rolls + ' (' + fmtNum(rep.mt) + ' mt + ' + fmtNum(rep.kg) + ' kg)', s: 16, after: 16 },
    { t: 'MÜŞTERİLERE GÖRE', s: 15, b: true, c: '#00E5FF', after: 6 }];
  rep.customerList.slice(0, 10).forEach(function (x) { lines.push({ t: x.name + ': ' + fmtNum(x.meters) + ' mt (' + x.jobs + ' iş)', s: 16 }); });
  lines.push({ t: 'KALIPLARA GÖRE', s: 15, b: true, c: '#FFB300', before: 14, after: 6 });
  rep.patternList.slice(0, 10).forEach(function (x) { lines.push({ t: x.name + ': ' + fmtNum(x.meters) + ' mt', s: 16 }); });
  el.disabled = true;
  return drawLinesImage(lines).then(function (blob) {

  }).then(function (r) {
    if (r === 'blocked') UI.toast('Önizlemede dosya paylaşımı kapalı', 'info');
    else if (r === 'downloaded') UI.toast('Rapor görseli indirildi');
  }).then(function () { el.disabled = false; }, function (e) { el.disabled = false; throw e; });
};
// Satır listesinden paylaşılabilir PNG üretir
function drawLinesImage(lines) {
  var W = 720, pad = 32, lineH = 30;
  var font = function (l) { return (l.b ? '600 ' : '') + l.s + 'px "Exo 2", Arial, sans-serif'; };
  var m = document.createElement('canvas').getContext('2d'), H = pad;
  lines.forEach(function (l) {
    H += l.before || 0; m.font = font(l);
    wrapText(m, l.t, W - pad * 2).forEach(function () { H += lineH * (l.s > 18 ? 1.2 : 1); });
    H += l.after || 4;
  });
  H += pad;
  var cv = document.createElement('canvas'); cv.width = W; cv.height = Math.ceil(H);
  var g = cv.getContext('2d');
  g.fillStyle = '#0A1224'; g.fillRect(0, 0, W, cv.height);
  g.strokeStyle = 'rgba(0,229,255,.4)'; g.lineWidth = 2; g.strokeRect(8, 8, W - 16, cv.height - 16);
  var y = pad;
  lines.forEach(function (l) {
    y += l.before || 0; g.font = font(l); g.fillStyle = l.c || '#E6F7FF';
    wrapText(g, l.t, W - pad * 2).forEach(function (p) {
      y += lineH * (l.s > 18 ? 1.2 : 1);
      if (l.center) { g.textAlign = 'center'; g.fillText(p, W / 2, y); g.textAlign = 'left'; } else g.fillText(p, pad, y);
    });
    y += l.after || 4;
  });
  return new Promise(function (resolve, reject) { cv.toBlob(function (b) { if (b) resolve(b); else reject(new Error('Görsel oluşturulamadı')); }, 'image/png'); });
}

/* ---------- Otomatik yedek ----------
   APK'da sormadan telefonun Belgeler klasörüne yazar; her seferinde eski
   dosyanın üzerine kaydeder. Açılışta günde bir kez ve uygulama arka plana
   geçerken (değişiklik varsa, en fazla 10 dakikada bir) çalışır. */
var AutoBackup = {
  PATH: 'MIT-Holo/mit-holo-otomatik-yedek.json',
  dirty: false, running: false, lastTs: 0, info: null,
  available: function () { return isNative() && !!plugin('Filesystem'); },
  loadInfo: function () { var self = this; return Meta.get('autoBackup').then(function (v) { self.info = v || null; }); },
  statusHtml: function () {
    if (!this.available()) return '<p>Otomatik yedek yalnızca telefondaki uygulamada (APK) çalışır.</p>';
    if (!Settings.autoBackup) return '<p>Kapalı. Ayarlar ekranından açabilirsin.</p>';
    var i = this.info;
    return '<p>Sormadan telefona yazılır; her seferinde eski dosyanın üzerine kaydedilir.</p>' +
      (i ? '<p>Son yedek: <b style="color:var(--st-done)">' + new Date(i.at).toLocaleString('tr-TR') + '</b><br>Konum: ' + esc(i.where) + '</p>'
        : '<p class="hint">Henüz otomatik yedek alınmadı.</p>') +
      (i && i.err ? '<p class="err">Son deneme başarısız: ' + esc(i.err) + '</p>' : '');
  },
  write: function (dir, path, json) {
    var fs = plugin('Filesystem');
    var opts = { path: path, data: json, directory: dir, encoding: 'utf8', recursive: true };
    return fs.writeFile(opts).catch(function () {
      // Eski dosya silinip yeniden yazılır
      return fs.deleteFile({ path: path, directory: dir }).catch(function () {}).then(function () { return fs.writeFile(opts); });
    });
  },
  run: function (force) {
    var self = this;
    if (!this.available() || this.running || (!Settings.autoBackup && !force)) return Promise.resolve(false);
    if (!Data.customers.length && !Data.patterns.length) return Promise.resolve(false);
    this.running = true;
    var wasDirty = this.dirty;
    this.dirty = false;
    return Data.buildBackup().then(function (b) {
      var json = JSON.stringify(b);
      return self.write('DOCUMENTS', self.PATH, json).then(function () { return 'Belgeler/' + self.PATH; }, function () {
        // Belgeler klasörüne yazılamazsa uygulamanın dış klasörüne yaz
        return self.write('EXTERNAL', self.PATH, json).then(function () { return 'Android/data/com.turkmavzercell.mitholo/files/' + self.PATH; });
      });
    }).then(function (where) {
      self.info = { at: new Date().toISOString(), where: where };
      self.lastTs = Date.now();
      return Meta.set('autoBackup', self.info).then(function () { return true; });
    }, function (e) {
      console.error(e);
      self.dirty = self.dirty || wasDirty;
      self.info = Object.assign({}, self.info || {}, { err: e && e.message ? e.message : 'yazılamadı' });
      return Meta.set('autoBackup', self.info).then(function () { return false; });
    }).then(function (ok) { self.running = false; return ok; });
  },
  daily: function () {
    var self = this;
    return this.loadInfo().then(function () {
      if (!self.info || !self.info.at || new Date(self.info.at).toDateString() !== new Date().toDateString()) return self.run();
    });
  },
  onHide: function () { if (this.dirty && Date.now() - this.lastTs > 10 * 60 * 1000) this.run(); }
};
Actions['auto-now'] = function (el) {
  el.disabled = true;
  return AutoBackup.run(true).then(function (ok) {
    el.disabled = false;
    UI.toast(ok ? 'Otomatik yedek güncellendi' : 'Otomatik yedek yazılamadı', ok ? 'ok' : 'err');

/* ===== Kumaş topu girişi =====
   Giriş kutusu bir kez oluşturulur, top eklenince yalnızca liste ve toplamlar
   yeniden çizilir; böylece Android'de klavye kapanmaz. */
function rollSkeleton(k) {
  return '<div data-roll="' + k + '"><div class="unit-row">' +
    '<button class="unit-btn" data-act="roll-unit" data-k="' + k + '" data-u="mt">Metre (mt)</button>' +
    '<button class="unit-btn" data-act="roll-unit" data-k="' + k + '" data-u="kg">Kilo (kg)</button></div>' +
    '<div class="roll-in" style="margin-top:8px"><span class="cnt" data-cnt></span>' +
    '<input class="inp" type="number" inputmode="decimal" step="any" enterkeyhint="done" data-key="roll-in" data-k="' + k + '" />' +
    '<button class="btn pri add" data-act="roll-add" data-k="' + k + '" aria-label="Topu ekle">' + icon('plus', 24) + '</button></div>' +
    '<div data-dyn style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div></div>';
}
function rollBox(k) { return JF && JF.root.querySelector('[data-roll="' + k + '"]'); }
function rollPaint(k) {
  var box = rollBox(k);
  if (!box) return;
  var unit = JF.units[k] || 'mt', t = calcRollTotals(jfRolls(k), JF.draft.fabricGramsPerMeter);
  Array.prototype.forEach.call(box.querySelectorAll('.unit-btn'), function (b) {
    var on = b.getAttribute('data-u') === unit;
    b.classList.toggle('on-mt', on && unit === 'mt');
    b.classList.toggle('on-kg', on && unit === 'kg');
  });
  box.querySelector('[data-key="roll-in"]').placeholder = unit === 'mt' ? 'Metre gir ve ekle' : 'Kilo gir ve ekle';
  var cnt = unit === 'mt' ? t.meterRolls.length : t.kgRolls.length, ce = box.querySelector('[data-cnt]');
  ce.textContent = cnt ? cnt + ' top' : '';
  ce.style.display = cnt ? 'flex' : 'none';
  var chip = function (r) {
    if (JF.editing === r.id) {
      return '<div class="rchip ' + r.unit + '"><input type="number" inputmode="decimal" value="' + r.value + '" data-key="roll-edit" data-blur="roll-edit" data-k="' + k + '" data-r="' + r.id + '" /></div>';
    }
    return '<div class="rchip ' + r.unit + (k === 'un' && JF.sel[r.id] ? ' sel' : '') + '" data-act="roll-chip" data-lp="1" data-k="' + k + '" data-r="' + r.id + '">' +
      '<span>' + fmtNum(r.value) + ' ' + r.unit + '</span><button class="x" data-act="roll-del" data-k="' + k + '" data-r="' + r.id + '" aria-label="Topu sil">' + icon('x', 16) + '</button></div>';
  };
  var html = '';
  if (t.meterRolls.length) html += '<p class="roll-g">Metre Topları (' + t.meterRolls.length + ')</p><div class="roll-grid">' + t.meterRolls.map(chip).join('') + '</div>';
  if (t.kgRolls.length) html += '<p class="roll-g">Kilo Topları (' + t.kgRolls.length + ')</p><div class="roll-grid">' + t.kgRolls.map(chip).join('') + '</div>';
  if (t.meterRolls.length || t.kgRolls.length) {
    html += '<div class="totals"><div><span>Toplam Metre</span><span class="t-mt">' + fmtNum(t.totalMeters) + ' mt</span></div>' +
      '<div><span>Toplam Kilo</span><span class="t-kg">' + fmtNum(t.totalKg) + ' kg' + (t.kgEquivalentMeters > 0 ? ' (≈ ' + fmtNum(t.kgEquivalentMeters) + ' mt)' : '') + '</span></div>' +
      '<div class="t-all"><span>Genel Toplam</span><span>' + fmtNum(t.grandTotalMeters) + ' mt</span></div></div>';
  }
  box.querySelector('[data-dyn]').innerHTML = html;
  var ed = box.querySelector('[data-key="roll-edit"]');
  if (ed) { ed.focus(); ed.select(); }
}
function rollCommit(k, input) {
  var num = parseFloat(String(input.value).replace(',', '.'));
  input.value = '';
  if (!isFinite(num) || num <= 0) return;
  jfSetRolls(k, jfRolls(k).concat([{ id: uid(), value: num, unit: JF.units[k] || 'mt' }]));
  rollPaint(k);
  jfTotals();
  Sound.play('pop');
}
Keys['roll-in'] = function (el, e) {

// Uzun basma (2 sn): top değerini düzenleme moduna geçirir
var LongPress = {
  timer: null, x: 0, y: 0, firedAt: 0,
  bind: function () {
    var self = this;
    document.addEventListener('pointerdown', function (e) {
      var el = e.target.closest('[data-lp]');
      if (!el || e.target.closest('.x')) return;
      self.x = e.clientX; self.y = e.clientY;
      clearTimeout(self.timer);
      self.timer = setTimeout(function () {
        if (!JF) return;
        self.firedAt = Date.now();
        JF.editing = el.getAttribute('data-r');
        haptic(30);
        rollPaint(el.getAttribute('data-k'));
      }, 2000);
    });
    document.addEventListener('pointermove', function (e) {
      if (self.timer && (Math.abs(e.clientX - self.x) > 12 || Math.abs(e.clientY - self.y) > 12)) { clearTimeout(self.timer); self.timer = null; }
    });
    var clear = function () { clearTimeout(self.timer); self.timer = null; };
    document.addEventListener('pointerup', clear);
    document.addEventListener('pointercancel', clear);
  }
};

function jfAddPhotos(dataUrls) {
  var d = JF.draft, room = 25 - d.photos.length;
  if (room <= 0) { UI.toast('En fazla 25 fotoğraf eklenebilir', 'err'); return Promise.resolve(); }
  if (dataUrls.length > room) UI.toast('Sadece ' + room + ' fotoğraf daha eklenebildi (sınır 25)', 'info');
  var jf = JF, chain = Promise.resolve();
  dataUrls.slice(0, room).forEach(function (u) {
    chain = chain.then(function () { return Photos.save(u).then(function (id) { jf.draft.photos.push(id); }); });
  });
  return chain.then(function () { if (JF === jf) { jfDirty(); jfPaintPhotos(); } }, function (e) {
    UI.toast('Fotoğraf kaydedilemedi: ' + (e && e.message ? e.message : 'depolama hatası'), 'err');
  });
}

// Özet görseli: canvas'a elle çizilir (dış kütüphane yok)
function shareJobImage(customer, job) {
  var t = calcJobTotals(job), W = 720, pad = 32, lineH = 30, lines = [];
  var C = { cy: '#00E5FF', am: '#FFB300', tx: '#E6F7FF', tx2: '#8FB3C7' };
  var status = job.status === 'delivered' && job.deliveredAt ? 'Teslim Edildi (' + fmtDate(job.deliveredAt) + ')' : 'İmalatta';
  lines.push({ t: 'İŞ DETAYI', s: 22, b: true, c: C.cy, center: true, after: 18 });
  lines.push({ t: 'Müşteri: ' + customer.name, s: 18 });
  lines.push({ t: 'İş / Model: ' + jobDisplayName(job), s: 18 });
  lines.push({ t: 'Durum: ' + status, s: 18 });
  lines.push({ t: 'Kumaş: ' + [job.fabricType, job.fabricColor].filter(Boolean).join(' - ') + (job.fabricGramsPerMeter ? ' (1 mt: ' + job.fabricGramsPerMeter + ' gr)' : ''), s: 18 });
  if (job.notes) lines.push({ t: 'Not: ' + job.notes, s: 16, wrap: true });
  lines.push({ t: 'Fotoğraf: ' + job.photos.length + ' adet', s: 18, after: 16 });
  lines.push({ t: 'KUMAŞ TOPLARI', s: 15, b: true, c: C.tx2, after: 8 });
  var push = function (title, tt) {
    lines.push({ t: title, s: 16, b: true });
    if (tt.meterRolls.length) {
      lines.push({ t: 'Metre: ' + tt.meterRolls.map(function (r) { return fmtNum(r.value); }).join(', '), s: 15, c: C.cy, wrap: true });
      lines.push({ t: 'Toplam Metre: ' + fmtNum(tt.totalMeters) + ' mt (' + tt.meterRolls.length + ' top)', s: 14, c: C.tx2 });
    }
    if (tt.kgRolls.length) {
      lines.push({ t: 'Kilo: ' + tt.kgRolls.map(function (r) { return fmtNum(r.value); }).join(', '), s: 15, c: C.am, wrap: true });
      lines.push({ t: 'Toplam Kilo: ' + fmtNum(tt.totalKg) + ' kg (' + tt.kgRolls.length + ' top)' + (tt.kgEquivalentMeters > 0 ? ' ≈ ' + fmtNum(tt.kgEquivalentMeters) + ' mt' : ''), s: 14, c: C.tx2 });
    }
    lines.push({ t: 'Kalıp Toplamı: ' + fmtNum(tt.grandTotalMeters) + ' mt', s: 14, after: 12 });
  };
  if (job.unassignedRolls.length) push('Atanmamış Toplar', calcRollTotals(job.unassignedRolls, job.fabricGramsPerMeter));
  job.patternGroups.forEach(function (g) { if (g.fabricRolls.length) push(g.patternName || 'İsimsiz Kalıp', calcRollTotals(g.fabricRolls, job.fabricGramsPerMeter)); });
  lines.push({ t: 'Genel Toplam: ' + fmtNum(t.grandTotalMeters) + ' mt (' + (t.meterRolls.length + t.kgRolls.length) + ' top)', s: 20, b: true, c: C.cy, before: 10 });

  var font = function (l) { return (l.b ? '600 ' : '') + l.s + 'px "Exo 2", Arial, sans-serif'; };
  var m = document.createElement('canvas').getContext('2d'), H = pad, rows = [];
  lines.forEach(function (l) {
    H += l.before || 0;
    m.font = font(l);
    var parts = l.wrap ? wrapText(m, l.t, W - pad * 2) : [l.t];
    parts.forEach(function (p) { H += lineH * (l.s > 18 ? 1.2 : 1); rows.push(p); });
    H += l.after || 4;
  });
  H += pad;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = Math.ceil(H);
  var g = cv.getContext('2d');
  g.fillStyle = '#0A1224'; g.fillRect(0, 0, W, cv.height);
  g.strokeStyle = 'rgba(0,229,255,.4)'; g.lineWidth = 2; g.strokeRect(8, 8, W - 16, cv.height - 16);
  var y = pad;
  lines.forEach(function (l) {
    y += l.before || 0;
    g.font = font(l); g.fillStyle = l.c || C.tx;
    var parts = l.wrap ? wrapText(g, l.t, W - pad * 2) : [l.t];
    parts.forEach(function (p) {
      y += lineH * (l.s > 18 ? 1.2 : 1);
      if (l.center) { g.textAlign = 'center'; g.fillText(p, W / 2, y); g.textAlign = 'left'; }
      else g.fillText(p, pad, y);
    });
    y += l.after || 4;
  });
  return new Promise(function (resolve, reject) {
    cv.toBlob(function (blob) {
      if (!blob) { reject(new Error('Görsel oluşturulamadı')); return; }
      var fname = 'is-ozeti-' + new Date().toISOString().slice(0, 10) + '.png';
      shareOrDownload(blob, fname, 'İş Özeti').then(resolve, reject);
    }, 'image/png');
  });
}
function wrapText(ctx, text, maxW) {
  var words = String(text).split(' '), out = [], cur = '';
  words.forEach(function (w) {
    var test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w; } else cur = test;
  });
  if (cur) out.push(cur);
  return out;
}

/* ===== Fotoğraf görüntüleyici (kaydırmalı) ===== */
Forms.lightbox = function (ids, start) {
  if (!ids.length) return;
  var root = document.getElementById('sheet-root');
  var el = document.createElement('div');
  el.className = 'lb';
  var idx = start || 0, sx = null;
  function paint() {
    el.innerHTML = '<img alt="Fotoğraf ' + (idx + 1) + '" />' +
      '<button class="ibtn lb-x" data-act="back" aria-label="Kapat">' + icon('x', 26) + '</button>' +
      (ids.length > 1 ? '<button class="ibtn lb-p" data-act="lb-step" data-d="-1" aria-label="Önceki">' + icon('left', 28) + '</button>' +
        '<button class="ibtn lb-n" data-act="lb-step" data-d="1" aria-label="Sonraki">' + icon('right', 28) + '</button>' +
        '<div class="lb-c">' + (idx + 1) + ' / ' + ids.length + '</div>' : '');
    var img = el.querySelector('img');
    Photos.get(ids[idx]).then(function (d) { if (d) img.src = d; });
  }
  el.__step = function (dd) { idx = (idx + dd + ids.length) % ids.length; paint(); };
  el.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) el.__step(dx > 0 ? -1 : 1);
    sx = null;
  });
  root.appendChild(el);
  UI.push({ kind: 'lightbox', el: el, onClose: function () { if (el.parentNode) el.parentNode.removeChild(el); } });
  paint();
};
Actions['lb-step'] = function (el) { var t = UI.top(); if (t && t.el.__step) t.el.__step(parseInt(el.getAttribute('data-d'), 10)); };

var Fx = {
  el: null, star: null, cat: null, timers: [], anims: [], paused: false, enabled: true,
  init: function () {
    this.el = document.getElementById('fx');
    this.el.innerHTML = '<div class="star"></div><button id="cat" data-act="cat" aria-label="Uzay kedisi">' + CAT_SVG + '</button>';
    this.star = this.el.querySelector('.star');
    this.cat = this.el.querySelector('#cat');
    this.enabled = Settings.cat !== false;
    if (this.enabled) this.cycle();
  },
  setEnabled: function (on) { this.enabled = on; this.reset(); if (on && !this.paused) this.cycle(); },
  later: function (fn, ms) { var t = setTimeout(fn, ms); this.timers.push(t); },
  reset: function () {
    this.timers.forEach(clearTimeout); this.timers = [];
    this.anims.forEach(function (a) { try { a.cancel(); } catch (e) {} }); this.anims = [];
    if (this.cat) { this.cat.classList.remove('live'); this.cat.style.opacity = '0'; }
    if (this.star) this.star.style.opacity = '0';
  },
  pause: function () { this.paused = true; this.reset(); },
  resume: function () { this.paused = false; if (this.enabled) this.cycle(); },
  anim: function (el, frames, opts) { var a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts)); this.anims.push(a); return a; },
  cycle: function () {
    var self = this;
    this.reset();
    this.later(function () {
      if (self.paused || !self.enabled || document.hidden || Impact.active()) { self.cycle(); return; }
      var W = window.innerWidth, H = window.innerHeight;
      var x = W * (0.15 + Math.random() * 0.7), y = H * (0.2 + Math.random() * 0.25);
      self.cat.style.left = x + 'px'; self.cat.style.top = y + 'px';
      var appear = function () {
        self.cat.classList.add('live');
        self.anim(self.cat, [{ opacity: 0, transform: 'scale(.12)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 550, easing: 'ease-out' });
        self.later(function () {
          self.anim(self.cat, [{ transform: 'translate(0,0) scale(1)' }, { transform: 'translate(10px,-8px) scale(1.15)' }], { duration: 3000, easing: 'ease-in-out' });
        }, 550);
        self.later(function () {
          self.cat.classList.remove('live');
          if (REDUCED) { self.anim(self.cat, [{ opacity: 1 }, { opacity: 0 }], { duration: 400 }); }
          else {
            self.anim(self.cat, [{ opacity: 1, transform: 'translate(10px,-8px) scale(1.15)' }, { opacity: 0, transform: 'translate(10px,-8px) scale(.1)' }], { duration: 400, easing: 'ease-in' });
            self.shoot(x + 10, y - 8, x + 10 + W * 0.6, y - H * 0.5, 800, 400);
          }
          self.later(function () { self.cycle(); }, 1200);
        }, 3550);
      };
      if (REDUCED) { appear(); return; }
      self.shoot(x - W * 0.5, y - H * 0.35, x, y, 650, 0);
      self.later(appear, 650);
    }, 10000);
  },
  // Kayan yıldız: (x0,y0) → (x1,y1)
  shoot: function (x0, y0, x1, y1, dur, delay) {
    var ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
    var tf = function (x, y) { return 'translate(' + (x - 120) + 'px,' + (y - 1.5) + 'px) rotate(' + ang + 'deg)'; };
    this.anim(this.star, [
      { opacity: 0, transform: tf(x0, y0) }, { opacity: 1, offset: 0.15, transform: tf(x0 + (x1 - x0) * 0.15, y0 + (y1 - y0) * 0.15) },
      { opacity: 1, offset: 0.85, transform: tf(x0 + (x1 - x0) * 0.85, y0 + (y1 - y0) * 0.85) }, { opacity: 0, transform: tf(x1, y1) }

  }
};

/* ---------- Oyun çerçevesi ----------
   Ortak: temaya göre arka plan (gece uzayı / gün doğumu gökyüzü), başlamadan
   önce kısa anlatım ekranı ("Başlamak için dokun"), parçacık patlamaları,
   uçan puan yazıları ve hafif ekran sarsıntısı. */
var Game = {
  active: null, idx: 0, records: {}, raf: 0, cv: null, g: null, W: 0, H: 0, last: 0, over: false, st: null,
  list: [],
  recent: [], cur: 0,
  // Kedi: rastgele oyun; son 3 oynanan oyun tekrar gelmez
  randomIdx: function () {
    var self = this, pool = [];
    this.list.forEach(function (g, i) { if (self.recent.indexOf(i) < 0) pool.push(i); });
    if (!pool.length) pool = this.list.map(function (g, i) { return i; });
    return pool[Math.floor(Math.random() * pool.length)];
  },
  remember: function (i) {
    this.cur = i;
    this.recent = this.recent.filter(function (x) { return x !== i; });
    this.recent.push(i);
    if (this.recent.length > 3) this.recent.shift();
  },
  headHtml: function () {
    return '<button class="btn sm" data-act="game-next" aria-label="Sonraki oyun">Sonraki ' + icon('right', 16) + '</button>';
  },
  open: function (idx) {
    if (idx === undefined) idx = this.randomIdx();
    var game = this.list[idx];
    this.remember(idx);
    var self = this;
    UI.openPanel({ id: 'game', title: game.name, onClose: function () { self.stop(); self.active = null; } });
    UI.setHead(esc(game.name) + '<small>' + esc(game.hint) + '</small>', this.headHtml());
    var body = UI.pBody();
    body.style.padding = '0';
    body.style.display = 'flex';
    body.style.flexDirection = 'column';
    body.innerHTML = '<div class="game-wrap"><div class="game-hud"><span>' + esc(game.scoreLabel || 'Skor') + ': <b data-gs>0</b></span><span data-gx></span><span>Rekor: <b data-gr>' + this.recText(game) + '</b></span></div>' +
      '<div class="game-cv"><canvas></canvas><div class="game-over hidden" data-go></div></div></div>';
    this.active = game;
    this.cv = body.querySelector('canvas');
    var pt = function (e) { var r = self.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    this.cv.addEventListener('pointerdown', function (e) {
      if (self.over || !self.active || !self.st) return;
      try { self.cv.setPointerCapture(e.pointerId); } catch (err) {}
      var p = pt(e);
      if (!self.st.started) {
        self.st.started = true;
        Sound.play('open');
        if (self.active.begin) self.active.begin(self.st, p);
        return;
      }
      if (self.active.down) self.active.down(self.st, p);
    });
    this.cv.addEventListener('pointerup', function (e) {
      if (self.over || !self.active || !self.st || !self.st.started) return;
      if (self.active.up) self.active.up(self.st, pt(e));
    });
    this.cv.addEventListener('pointermove', function (e) {
      if (self.over || !self.active || !self.st || !self.st.started) return;
      if (self.active.move) self.active.move(self.st, pt(e));
    });
    requestAnimationFrame(function () { self.start(); });
  },
  recText: function (game) { var r = this.records[game.id]; return r === undefined ? '—' : String(r); },
  start: function () {
    if (!this.active) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), r = this.cv.getBoundingClientRect();
    this.W = r.width; this.H = r.height;
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr);
    this.g = this.cv.getContext('2d');
    this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.over = false;
    UI.pBody().querySelector('[data-go]').classList.add('hidden');
    this.st = { W: this.W, H: this.H, score: 0, t: 0, started: false, fx: [], pops: [], shake: 0, bg: this.makeBg(this.W, this.H) };
    this.setExtra('');
    this.active.init(this.st);
    this.setScore(0);
    this.last = performance.now();
    var self = this;
    cancelAnimationFrame(this.raf);
    (function loop(now) {
      if (!self.active || self.over) return;
      var dt = Math.min(0.05, (now - self.last) / 1000);
      self.last = now;
      if (!document.hidden) self.frame(dt);
      self.raf = requestAnimationFrame(loop);
    })(this.last);
  },
  frame: function (dt) {
    var s = this.st, g = this.g;
    s.t += dt;
    if (s.started) this.active.step(s, dt);
    if (!this.active) return;
    // Parçacıklar ve uçan yazılar
    s.fx.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt; });
    s.fx = s.fx.filter(function (p) { return p.life > 0; });
    s.pops.forEach(function (p) { p.y -= 46 * dt; p.life -= dt; });
    s.pops = s.pops.filter(function (p) { return p.life > 0; });
    if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 30);
    g.save();
    if (s.shake > 0) g.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
    this.drawBg(g, s);
    this.active.draw(g, s, gPal());
    var P = gPal();
    s.fx.forEach(function (p) {
      g.globalAlpha = Math.max(0, p.life / p.max);
      g.fillStyle = p.c;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();

    g.globalAlpha = 1;

    s.pops.forEach(function (p) {
      g.globalAlpha = Math.min(1, p.life * 2);
      g.lineWidth = 4; g.strokeStyle = P.outline; g.strokeText(p.text, p.x, p.y);
      g.fillStyle = p.c; g.fillText(p.text, p.x, p.y);
    });
    g.globalAlpha = 1;
    g.restore();
    if (!s.started) this.drawIntro(g, s, P);
  },
  // Arka plan: koyu temada yıldızlı gece, açık temada gün doğumu gökyüzü
  makeBg: function (W, H) {
    var stars = [], clouds = [];
    for (var i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 });
    for (var k = 0; k < 4; k++) clouds.push({ x: Math.random() * W, y: H * (0.08 + Math.random() * 0.45), w: 70 + Math.random() * 70, v: 6 + Math.random() * 10 });
    return { stars: stars, clouds: clouds };
  },
  drawBg: function (g, s) {
    var W = s.W, H = s.H, P = gPal(), gr;
    if (P.light) {
      gr = g.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, '#A9D3EE'); gr.addColorStop(0.5, '#EAF1F4'); gr.addColorStop(0.82, '#FFE9CF'); gr.addColorStop(1, '#FFD0A0');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      var sun = g.createRadialGradient(W / 2, H * 1.02, 10, W / 2, H * 1.02, H * 0.55);
      sun.addColorStop(0, 'rgba(255,170,70,.9)'); sun.addColorStop(0.25, 'rgba(255,190,110,.45)'); sun.addColorStop(1, 'rgba(255,200,130,0)');
      g.fillStyle = sun; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.8)';
      s.bg.clouds.forEach(function (c) {
        var x = ((c.x + s.t * c.v) % (W + 160)) - 80;
        g.beginPath();
        g.ellipse(x, c.y, c.w * 0.5, c.w * 0.16, 0, 0, Math.PI * 2);
        g.ellipse(x - c.w * 0.18, c.y - c.w * 0.08, c.w * 0.22, c.w * 0.14, 0, 0, Math.PI * 2);
        g.ellipse(x + c.w * 0.15, c.y - c.w * 0.1, c.w * 0.26, c.w * 0.17, 0, 0, Math.PI * 2);
        g.fill();
      });
    } else {
      gr = g.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, '#05080F'); gr.addColorStop(1, '#0A1224');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      var neb = g.createRadialGradient(W * 0.75, H * 0.2, 0, W * 0.75, H * 0.2, W * 0.7);

/* Ortak çizim yardımcıları — renkler temaya göre */
function gPal() {
  if (Settings.theme === 'light') return {
    light: true, cy: '#00739E', soft: '#1B8FBF', dim: '#7FBFD8', am: '#D96F00', amd: '#B85C00', tx: '#102238', tx2: '#4A5F75',

  };
  return {

    ok: '#2EE6A6', blue: '#3D8BFF', red: '#FF4D5E', card: '#0F1B33', cardBack: '#0B1830', outline: 'rgba(5,8,15,.9)', glow: 14
  };
}
// Noktanın doğru parçasına uzaklığı (kesme isabeti için)
function segDist(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

  g.save(); g.translate(x, y); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = lw || 2.5; g.lineCap = 'round'; g.lineJoin = 'round';

  var gr = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);

// Küçük uzay kedisi kafası (oyuncu karakteri)
function drawCat(g, x, y, r, P, tilt) {
  g.save(); g.translate(x, y); g.rotate(tilt || 0);
  glow(g, P.cy, 12);
  g.fillStyle = P.light ? 'rgba(0,115,158,.12)' : 'rgba(0,229,255,.14)';

/* 3) Glif Hafızası: başta kartlar 2 sn açık gösterilir; çevirme animasyonlu */
Game.list.push({
  id: 'memory', name: 'Glif Hafızası', hint: 'Aynı glif çiftlerini bul', scoreLabel: 'Hamle', lowerBetter: true,
  howto: ['Kartlar önce 2 saniye açık gösterilir.', 'Sonra kapanır; iki karta dokunarak', 'aynı renk ve glifteki eşleri bul.', 'Ne kadar az hamle, o kadar iyi.'],
  init: function (s) {
    var deck = [];
    for (var i = 0; i < 8; i++) { deck.push(i); deck.push(i); }
    for (var j = deck.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = deck[j]; deck[j] = deck[k]; deck[k] = t; }
    s.cards = deck.map(function (v) { return { v: v, open: false, done: false, f: 0 }; });
    s.pick = []; s.wait = 0; s.moves = 0; s.found = 0; s.preview = -1;
  },
  begin: function (s) { s.preview = 2; s.cards.forEach(function (c) { c.open = true; }); Game.setExtra('Ezberle!'); },
  layout: function (s) {
    var size = Math.min((s.W - 24) / 4, (s.H - 24) / 4);

      s.moves++; Game.setScore(s.moves);

  init: function (s) {

    this.food(s); Game.setExtra('Uzunluk 3');
  },
  food: function (s) {
    var free = function () {
      for (var tries = 0; tries < 500; tries++) {
        var f = { x: Math.floor(Math.random() * s.cols), y: Math.floor(Math.random() * s.rows) };
        if (!s.body.some(function (b) { return b.x === f.x && b.y === f.y; })) return f;

    // Yem
    var pulse = 1 + 0.12 * Math.sin(s.t * 6);
    glow(g, P.am, 14); g.fillStyle = shade(g, cx(s.food.x), cy(s.food.y), c * 0.38, P.light ? '#FFE0B0' : '#FFE08A', P.am);
    g.beginPath(); g.arc(cx(s.food.x), cy(s.food.y), c * 0.36 * pulse, 0, Math.PI * 2); g.fill(); noGlow(g);
    if (s.gold) {
      g.globalAlpha = s.goldT < 2 ? 0.4 + 0.6 * Math.abs(Math.sin(s.t * 10)) : 1;
      gGlyph(g, 6, cx(s.gold.x), cy(s.gold.y), c * 0.42, P.am, 2.5);
      g.globalAlpha = 1;
    }
    // Gövde: baştan kuyruğa renk geçişi
    var n = s.body.length;
    for (var i = n - 1; i >= 0; i--) {
      var b = s.body[i], k = i / Math.max(1, n - 1), pad = 1 + k * c * 0.12;
      g.globalAlpha = 1 - k * 0.45;
      if (i === 0) glow(g, P.cy, 14);
      rr(g, s.ox + b.x * c + pad, s.oy + b.y * c + pad, c - pad * 2, c - pad * 2, c * 0.3);
      g.fillStyle = i === 0 ? P.cy : (i % 2 ? P.soft : P.cy); g.fill(); noGlow(g);
    }
    g.globalAlpha = 1;
    // Göz
    var h = s.body[0], ex = s.dir.y !== 0 ? c * 0.18 : 0, ey = s.dir.x !== 0 ? c * 0.18 : 0;
    g.fillStyle = P.light ? '#FFFFFF' : '#05080F';
    g.beginPath(); g.arc(cx(h.x) + s.dir.x * c * 0.15 + ex, cy(h.y) + s.dir.y * c * 0.15 + ey, c * 0.1, 0, Math.PI * 2);
    g.arc(cx(h.x) + s.dir.x * c * 0.15 - ex, cy(h.y) + s.dir.y * c * 0.15 - ey, c * 0.1, 0, Math.PI * 2); g.fill();
  }
});

/* 7) Uzay Savaşı: gemi parmağı takip eder ve otomatik ateş eder; düşmanları vur */
Game.list.push({
  id: 'shooter', name: 'Uzay Savaşı', hint: 'Gemiyi sürükle, otomatik ateş eder',
  howto: ['Parmağını sağa sola kaydır, gemi takip eder.', 'Turuncu "G": sırayla atış hızı (en çok %100)', 've mermi (en çok 10) artar; ikisi dolunca', 'G sadece eksik canı yeniler · 3 can.'],
  init: function (s) {
    s.px = s.W / 2; s.tx = s.W / 2; s.py = s.H - 70; s.shots = []; s.foes = []; s.eshots = []; s.drops = [];
    s.fire = 0; s.spawn = 1; s.lives = 3; s.inv = 0; s.pw = 0; s.spd = 0; s.gn = 1; s.lvl = 1; s.kills = 0;
    this.hud(s);
  },
  MAXSPD: 5, MAXGUN: 10,
  hud: function (s) { Game.setExtra('Sv ' + s.lvl + ' · ' + '♥♥♥'.slice(0, Math.max(0, s.lives)) + '♡♡♡'.slice(0, 3 - Math.max(0, s.lives)) + ' · ' + s.gn + 'x · %' + Math.round(s.spd / this.MAXSPD * 100)); },
  guns: function (s) { return s.gn; },
  // Atış aralığı: %0'da 0,22 sn → %100'de 0,08 sn
  rate: function (s) { return 0.22 - 0.14 * (s.spd / this.MAXSPD); },
  // Düşman canı her 5 seviyede %33 artar
  hpMul: function (s) { return Math.pow(1.33, Math.floor((s.lvl - 1) / 5)); },
  // Ödül: sırayla hız / mermi; ikisi de doluysa yalnızca eksik canı yeniler
  reward: function (s, P, x, y) {
    var spdFull = s.spd >= this.MAXSPD, gunFull = s.gn >= this.MAXGUN, msg;
    s.pw++;
    if (!spdFull && (s.pw % 2 === 1 || gunFull)) { s.spd++; msg = 'ATIŞ HIZI %' + Math.round(s.spd / this.MAXSPD * 100); }
    else if (!gunFull) { s.gn++; msg = 'MERMİ ' + s.gn + (s.gn >= this.MAXGUN ? ' (EN ÇOK)' : ''); }
    else if (s.lives < 3) { s.lives++; msg = 'CAN +1'; }
    else msg = 'CAN DOLU';
    Game.pop(x, y - 20, msg, P.am); this.hud(s);
  },
  begin: function (s, p) { s.tx = p.x; },
  down: function (s, p) { s.tx = p.x; },
  move: function (s, p) { s.tx = p.x; },
  hit: function (s) {
    if (s.inv > 0) return;
    var P = gPal();
    s.lives--; s.inv = 1.6; this.hud(s);
    Game.burst(s.px, s.py, P.red, 26); Game.shake(12); fb('err');
    if (s.lives <= 0) Game.end(s.score);
  },
  step: function (s, dt) {
    var P = gPal(), self = this;
    s.px += (s.tx - s.px) * Math.min(1, dt * 16);
    s.px = Math.max(22, Math.min(s.W - 22, s.px));
    if (s.inv > 0) s.inv -= dt;
    var lvl = 1 + Math.floor(s.kills / 10);
    if (lvl !== s.lvl) { s.lvl = lvl; this.hud(s); Game.pop(s.W / 2, s.H * 0.35, 'DALGA ' + lvl + '!', P.am); Sound.play('open'); }
    // Ateş
    s.fire -= dt;
    if (s.fire <= 0) {
      s.fire = this.rate(s);
      // Mermiler geminin önünde dar bir demet halinde, neredeyse paralel gider
      var n = this.guns(s), width = Math.min(34, 5 * (n - 1));
      for (var gi = 0; gi < n; gi++) {
        var k = n === 1 ? 0 : gi / (n - 1) - 0.5; // -0.5..0.5
        s.shots.push({ x: s.px + k * width, y: s.py - 22 - Math.abs(k) * 6, vx: k * 28 });
      }
    }
    s.shots.forEach(function (b) { b.y -= 640 * dt; b.x += (b.vx || 0) * dt; });
    s.shots = s.shots.filter(function (b) { return b.y > -20 && b.x > -20 && b.x < s.W + 20; });
    // Düşman üretimi: dalga ilerledikçe hızlı ve sık
    s.spawn -= dt;
    if (s.spawn <= 0) {
      var type = Math.random() < Math.min(0.45, 0.1 + s.lvl * 0.05) ? 'big' : 'small';
      s.foes.push({ x: 30 + Math.random() * (s.W - 60), y: -30, x0: 0, v: 70 + s.lvl * 22 + Math.random() * 40, ph: Math.random() * 6,
        amp: 20 + Math.random() * 50, hp: (type === 'big' ? 3 : 1) * this.hpMul(s), big: type === 'big', r: type === 'big' ? 22 : 16,
        cd: 1 + Math.random() * 2, k: Math.floor(Math.random() * 8) });
      s.foes[s.foes.length - 1].x0 = s.foes[s.foes.length - 1].x;
      s.foes[s.foes.length - 1].max = s.foes[s.foes.length - 1].hp;
      s.spawn = Math.max(0.28, 1.15 - s.lvl * 0.1);
    }
    s.foes.forEach(function (f) {
      f.y += f.v * dt; f.x = f.x0 + Math.sin(s.t * 1.8 + f.ph) * f.amp;
      f.cd -= dt;
      if (f.cd <= 0 && s.lvl >= 2 && f.y > 0 && f.y < s.H * 0.6) {
        f.cd = Math.max(0.9, 2.6 - s.lvl * 0.2) + Math.random();
        var dx = s.px - f.x, dy = s.py - f.y, d = Math.hypot(dx, dy) || 1, sp = 170 + s.lvl * 15;
        s.eshots.push({ x: f.x, y: f.y + f.r, vx: dx / d * sp, vy: dy / d * sp });
      }
    });
    // Çarpışmalar: mermi → düşman
    s.shots = s.shots.filter(function (b) {
      for (var i = 0; i < s.foes.length; i++) {
        var f = s.foes[i];
        if (Math.abs(b.x - f.x) < f.r + 3 && Math.abs(b.y - f.y) < f.r + 6) {
          f.hp--;
          Game.burst(b.x, b.y, P.cy, 4, 90);
          if (f.hp <= 0) {
            s.foes.splice(i, 1); s.kills++;
            var add = f.big ? 3 : 1;
            Game.setScore(s.score + add);
            Game.burst(f.x, f.y, f.big ? P.am : P.ok, f.big ? 30 : 18, 220); Game.pop(f.x, f.y - 20, '+' + add, f.big ? P.am : P.ok);
            Sound.play('pop'); haptic(10);
            if (Math.random() < (f.big ? 0.4 : 0.09)) s.drops.push({ x: f.x, y: f.y });
          }
          return false;
        }
      }
      return true;
    });
    // Düşman gemiye çarptı / kaçtı
    s.foes = s.foes.filter(function (f) {
      if (Math.hypot(f.x - s.px, f.y - s.py) < f.r + 16) { Game.burst(f.x, f.y, P.red, 20); self.hit(s); return false; }
      if (f.y > s.H + 30) return false;
      return true;
    });
    if (Game.over) return;
    s.eshots.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; });
    s.eshots = s.eshots.filter(function (b) {
      if (Math.hypot(b.x - s.px, b.y - s.py) < 16) { self.hit(s); return false; }
      return b.y < s.H + 20 && b.y > -20 && b.x > -20 && b.x < s.W + 20;
    });
    if (Game.over) return;
    s.drops.forEach(function (d) { d.y += 120 * dt; });
    s.drops = s.drops.filter(function (d) {
      if (Math.hypot(d.x - s.px, d.y - s.py) < 34) {
        self.reward(s, P, d.x, d.y);
        Game.burst(d.x, d.y, P.am, 18); fb('ok'); return false;
      }
      return d.y < s.H + 20;
    });
  },
  draw: function (g, s, P) {
    // Mermiler
    glow(g, P.cy, 10); g.strokeStyle = P.cy; g.lineWidth = s.gn > 4 ? 2 : 3; g.lineCap = 'round';
    s.shots.forEach(function (b) { g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - (b.vx || 0) * 0.018, b.y + 12); g.stroke(); });
    noGlow(g);
    glow(g, P.red, 10); g.fillStyle = P.red;
    s.eshots.forEach(function (b) { g.beginPath(); g.arc(b.x, b.y, 4.5, 0, Math.PI * 2); g.fill(); });
    noGlow(g);
    // Güçlendirme
    s.drops.forEach(function (d) {
      glow(g, P.am, 14); g.fillStyle = P.am; g.beginPath(); g.arc(d.x, d.y, 12, 0, Math.PI * 2); g.fill(); noGlow(g);
      g.fillStyle = P.light ? '#FFFFFF' : '#05080F'; g.font = '600 13px "Exo 2", sans-serif'; g.textAlign = 'center'; g.fillText('G', d.x, d.y + 5);
    });
    // Düşmanlar: glif işaretli uzaylı daireleri
    s.foes.forEach(function (f) {
      var col = f.big ? P.am : P.ok;
      glow(g, col, 12);
      g.fillStyle = shade(g, f.x, f.y, f.r, P.light ? '#FFFFFF' : 'rgba(230,247,255,.85)', col);
      g.beginPath(); g.ellipse(f.x, f.y, f.r * 1.25, f.r * 0.6, 0, 0, Math.PI * 2); g.fill(); noGlow(g);
      g.fillStyle = P.light ? 'rgba(0,115,158,.35)' : 'rgba(0,229,255,.35)';
      g.beginPath(); g.ellipse(f.x, f.y - f.r * 0.35, f.r * 0.6, f.r * 0.5, 0, Math.PI, 0); g.fill();
      gGlyph(g, f.k, f.x, f.y + f.r * 0.05, f.r * 0.32, P.light ? '#102238' : '#05080F', 2);
      if (f.max > 1 && f.hp < f.max) { // can çubuğu
        g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(f.x - 14, f.y - f.r - 9, 28, 4);
        g.fillStyle = P.red; g.fillRect(f.x - 14, f.y - f.r - 9, 28 * Math.max(0, f.hp / f.max), 4);
      }
    });
    // Oyuncu gemisi
    if (s.inv > 0 && Math.sin(s.t * 30) > 0) return;
    var x = s.px, y = s.py;
    g.fillStyle = P.am; g.globalAlpha = 0.6 + 0.4 * Math.random();
    g.beginPath(); g.moveTo(x - 7, y + 16); g.lineTo(x, y + 30 + Math.random() * 8); g.lineTo(x + 7, y + 16); g.fill(); g.globalAlpha = 1;
    glow(g, P.cy, 16);
    g.fillStyle = P.light ? '#FFFFFF' : '#0F1B33'; g.strokeStyle = P.cy; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(x, y - 24); g.lineTo(x + 20, y + 16); g.lineTo(x + 7, y + 10); g.lineTo(x, y + 18); g.lineTo(x - 7, y + 10); g.lineTo(x - 20, y + 16); g.closePath();
    g.fill(); g.stroke(); noGlow(g);
    g.fillStyle = s.pw > 0 ? P.am : P.cy; g.beginPath(); g.ellipse(x, y - 4, 4, 7, 0, 0, Math.PI * 2); g.fill();
  }
});

function boot() {
  Theme.early();
  document.getElementById('ver').textContent = 'v' + APP_VERSION;
  bindDelegates();
  LongPress.bind();
  UI.setupKeyboard();
  window.addEventListener('popstate', function () { UI.onPopState(); });
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { Sphere.resize(); }, 120); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Sphere.stop(); AutoBackup.onHide(); }
    else if (!UI.panelOpen()) Sphere.start();
  });
  window.addEventListener('error', function (e) { console.error(e.error || e.message); });

  Sphere.init();
  Impact.init();
  Orbit.init();
  App.refreshStats();

  Store.init().then(function (ok) {
    if (!ok) UI.toast('Veritabanı açılamadı: kayıtlar geçici bellekte tutulacak. Yedek almayı unutma.', 'err');
    return Meta.get('settings');
  }).then(function (s) {
    if (s && typeof s === 'object') Object.keys(Settings).forEach(function (k) { if (typeof s[k] === typeof Settings[k]) Settings[k] = s[k]; });
    Theme.apply();
    return Promise.all([Meta.get('records'), Meta.get('gameIdx')]);
  }).then(function (r) {
    Game.records = r[0] || {};
    Game.idx = r[1] || 0;
    return Data.load();
  }).then(function () {
    return runMigrations();
  }).then(function () {
    App.booted = true;
    App.refreshStats();
    Fx.init();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    setTimeout(cleanOrphanPhotos, 4000);
    setTimeout(function () { AutoBackup.daily(); }, 6000);
    return Meta.get('lastReminder');
  }).then(function (last) {
    if (Settings.reminder && new Date().getHours() >= 6 && last !== todayStr() && Data.customers.length) {
      setTimeout(function () { if (!UI.panelOpen()) Forms.reminder(); }, 1200);
    }
  }).catch(function (e) {
    console.error(e);
    UI.toast('Başlatma hatası: ' + (e && e.message ? e.message : e), 'err');
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
