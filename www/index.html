/* ================= TEMA ================= */
:root {
  --bg: #05080F;
  --panel: #0A1224;
  --raised: #0F1B33;
  --cy: #00E5FF;
  --cy-soft: #4DD8F0;
  --cy-dim: #0E7490;
  --am: #FFB300;
  --am-dark: #FF8F00;
  --tx: #E6F7FF;
  --tx2: #8FB3C7;
  --st-wait: #FFB300;
  --st-done: #2EE6A6;
  --st-arch: #6B7F99;
  --st-print: #3D8BFF;
  --red: #FF4D5E;
  --ink: 5,8,15;
  --cy-rgb: 0,229,255;
  --am-rgb: 255,179,0;
  --ok-rgb: 46,230,166;
  --print-rgb: 61,139,255;
  --red-rgb: 255,77,94;
  --panel-rgb: 10,18,36;
  --sky: var(--bg);
  --cy-a40: rgba(var(--cy-rgb),.4);
  --cy-a20: rgba(var(--cy-rgb),.2);
  --cy-a10: rgba(var(--cy-rgb),.1);
  --am-a20: rgba(var(--am-rgb),.2);
  --panel-a72: rgba(var(--panel-rgb),.72);
  --r6: 6px;
  --r12: 12px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --hud: 'Exo 2', system-ui, sans-serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
:root[data-theme="light"] {
  /* Gün doğumu: açık gökyüzü, ufukta turuncu ışık */
  --bg: #FFF4E6;
  --panel: #FFFBF5;
  --raised: #FFFFFF;
  --cy: #00739E;
  --cy-soft: #1B8FBF;
  --cy-dim: #7FBFD8;
  --am: #D96F00;
  --am-dark: #B85C00;
  --tx: #102238;
  --tx2: #4A5F75;
  --st-wait: #C26200;
  --st-done: #0F8A5C;
  --st-arch: #6B7F99;
  --st-print: #2456C8;
  --red: #D2263D;
  --ink: 255,250,242;
  --cy-rgb: 0,115,158;
  --am-rgb: 217,111,0;
  --ok-rgb: 15,138,92;
  --print-rgb: 36,86,200;
  --red-rgb: 210,38,61;
  --panel-rgb: 255,251,245;
  --sky: radial-gradient(120% 55% at 50% 108%, #FFB061 0%, rgba(255,176,97,.55) 30%, rgba(255,176,97,0) 62%),
         linear-gradient(to top, #FFD7A6 0%, #FFE9CF 22%, #F3EEE6 42%, #D6EAF6 70%, #A9D3EE 100%);
}
:root[data-theme="light"] .node-ring { background: rgba(255,255,255,.85); }
:root[data-theme="light"] .node-label { text-shadow: 0 0 6px #fff, 0 0 2px #fff; }
:root[data-theme="light"] #center-stats .big { text-shadow: 0 0 6px #fff, 0 0 14px #fff; }
:root[data-theme="light"] #center-stats .big-l, :root[data-theme="light"] #center-stats .s { text-shadow: 0 0 4px #fff, 0 0 8px #fff; }
:root[data-theme="light"] .btn.pri, :root[data-theme="light"] .fab, :root[data-theme="light"] .node-badge, :root[data-theme="light"] .ibtn.armed, :root[data-theme="light"] .btn.armed { color: #fff !important; }
:root[data-theme="light"] .drw-row.sel .cbox { color: #fff; }
:root[data-theme="light"] .panel::after, :root[data-theme="light"] .sheet::after { opacity: .03; }
.theme-seg { display: flex; gap: 8px; }
.theme-seg .btn { flex: 1; }
.theme-seg .btn.on { background: var(--cy); color: var(--panel); border-color: var(--cy); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--sky); color: var(--tx);
  font-family: var(--sans); font-size: 16px; line-height: 1.4;
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, textarea, select { font-family: inherit; font-size: 16px; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
.hud { font-family: var(--hud); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.hidden { display: none !important; }
.muted { color: var(--tx2); }
svg { flex-shrink: 0; }

/* ================= KÜRE SAHNESİ ================= */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage-top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 4;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px);
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
#stage-top .brand { font-size: 18px; color: var(--cy); }
#stage-top .brand small { display: block; font-size: 10px; color: var(--tx2); letter-spacing: .12em; }
#stage-top .ver { font-size: 10px; color: var(--tx2); }
#center-stats {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 1; text-align: center; pointer-events: none; transition: opacity 200ms;
}
#center-stats .big { font-family: var(--hud); font-weight: 600; font-size: 44px; line-height: 1; color: var(--tx); text-shadow: 0 0 4px var(--bg), 0 0 12px var(--bg), 0 0 18px var(--cy-a40); }
#center-stats .big-l, #center-stats .s { text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg); }
#center-stats .big-l { font-size: 10px; color: var(--cy-soft); margin-top: 4px; }
#center-stats .smalls { display: flex; gap: 14px; justify-content: center; margin-top: 8px; }
#center-stats .s { font-family: var(--hud); font-weight: 600; font-size: 16px; color: var(--am); }
#center-stats .s.s-print { color: var(--st-print); }
#center-stats .s span { display: block; font-size: 9px; color: var(--tx2); letter-spacing: .08em; }
#nodes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.node {
  position: absolute; left: 0; top: 0; width: 88px; margin-left: -44px; margin-top: -26px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: auto; will-change: transform, opacity; color: var(--tx);
}
.node.back { pointer-events: none; }
.node.back .node-badge { visibility: hidden; }
.node { -webkit-touch-callout: none; touch-action: none; }
.node.grabbed .node-ring { border-color: var(--am); box-shadow: 0 0 24px rgba(var(--am-rgb),.6); }
body.orbit-chaos .node { pointer-events: none; }
#impact-alert {
  position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translateX(-50%); z-index: 6;
  display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(92vw, 380px); pointer-events: none;
}
#impact-alert .ia-box {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--red);
  border: 1.5px solid var(--red); background: rgba(var(--red-rgb),.12); border-radius: var(--r6);
  animation: iaPulse .8s ease-in-out infinite alternate;
}
#impact-alert.ok .ia-box { color: var(--st-done); border-color: var(--st-done); background: rgba(var(--ok-rgb),.12); animation: none; }
#impact-alert .ia-box b { flex: 1; font-size: 14px; }
#impact-alert .ia-count { font-size: 30px; line-height: 1; min-width: 28px; text-align: center; }
#impact-alert .ia-rocket { pointer-events: auto; min-height: 56px; padding: 0 22px; font-size: 15px; background: var(--am); color: var(--bg); border-color: var(--am); box-shadow: 0 0 18px rgba(var(--am-rgb),.45); }
:root[data-theme="light"] #impact-alert .ia-rocket { color: #fff; }
@keyframes iaPulse { from { box-shadow: 0 0 0 rgba(var(--red-rgb),0); } to { box-shadow: 0 0 22px rgba(var(--red-rgb),.55); } }
body.panel-open #impact-alert { display: none; }
#stage.shake { animation: stShake .5s linear; }
@keyframes stShake { 0%,100% { transform: none; } 20% { transform: translate(-8px,4px); } 40% { transform: translate(7px,-5px); } 60% { transform: translate(-5px,-3px); } 80% { transform: translate(4px,3px); } }
#stage-hint { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 20px); z-index: 3; text-align: center; font-size: 13px; color: var(--tx2); pointer-events: none; }
body.no-gl #stage-hint, body.panel-open #stage-hint { display: none; }
.node-ring {
  position: relative; width: 52px; height: 52px; border-radius: 50%;
  border: 1.5px solid var(--cy-soft); background: rgba(var(--ink),.78);
  display: flex; align-items: center; justify-content: center; color: var(--cy);
  box-shadow: 0 0 10px var(--cy-a20), inset 0 0 10px var(--cy-a10);
}
.node.front .node-ring {
  border-color: var(--cy); box-shadow: 0 0 18px var(--cy-a40), inset 0 0 12px var(--cy-a20);
}
.node.front .node-ring::after {
  content: ''; position: absolute; inset: -7px; border-radius: 50%;
  border: 1.5px solid var(--am); box-shadow: 0 0 10px var(--am-a20);
}
.node-label { font-family: var(--hud); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; text-align: center; line-height: 1.15; text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
.node-badge {
  position: absolute; top: -6px; right: -10px; min-width: 22px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--am); color: var(--bg);
  font-family: var(--hud); font-weight: 600; font-size: 11px; display: flex; align-items: center; justify-content: center;
}
.node-badge:empty { display: none; }
/* WebGL yoksa: 2 sütunlu düz ızgara */
body.no-gl #gl, body.no-gl #center-stats { display: none; }
body.no-gl #nodes {
  position: absolute; inset: 0; top: calc(var(--sat) + 72px); pointer-events: auto; overflow-y: auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px 24px; align-content: start;
}
body.no-gl .node { position: relative; width: auto; margin: 0; transform: none !important; opacity: 1 !important; padding: 14px 4px; background: var(--panel); border: 1px solid var(--cy-a40); border-radius: var(--r12); min-height: 112px; justify-content: center; }

/* ================= HOLOGRAM PANEL ================= */
#panel-root { position: fixed; inset: 0; z-index: 10; perspective: 900px; pointer-events: none; }
.panel {
  position: absolute; inset: calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);
  background: var(--panel-a72); border: 1px solid var(--cy-a40);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  display: flex; flex-direction: column; pointer-events: auto; overflow: hidden;
  transform-origin: 50% 40%; animation: panelIn 150ms ease-out both;
}
.panel.out { animation: panelOut 150ms ease-in both; }
@keyframes panelIn { from { opacity: 0; transform: translateZ(-90px) rotateX(10deg); } to { opacity: 1; transform: none; } }
@keyframes panelOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateZ(-90px) rotateX(10deg); } }
.panel::before {
  content: ''; position: absolute; inset: 10px; pointer-events: none; z-index: 3;
  background:
    linear-gradient(var(--cy), var(--cy)) left top / 18px 2px no-repeat,
    linear-gradient(var(--cy), var(--cy)) left top / 2px 18px no-repeat,
    linear-gradient(var(--cy), var(--cy)) right top / 18px 2px no-repeat,
    linear-gradient(var(--cy), var(--cy)) right top / 2px 18px no-repeat,

    linear-gradient(var(--cy), var(--cy)) left bottom / 2px 18px no-repeat,

    linear-gradient(var(--cy), var(--cy)) right bottom / 2px 18px no-repeat;
  opacity: .8;
}
.panel::after {
  content: ''; position: absolute; left: 0; right: 0; top: -120px; height: 120px; pointer-events: none; z-index: 2;

}

.p-head {

}
.p-back {

  color: var(--cy); font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;

}

.p-title { flex: 1; min-width: 0; font-size: 15px; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.p-body { flex: 1; overflow-y: auto; padding: 12px 12px 96px; position: relative; z-index: 1; -webkit-overflow-scrolling: touch; }
.sub { position: absolute; inset: 0; background: var(--panel); display: flex; flex-direction: column; z-index: 5; animation: subIn 150ms ease-out both; }

/* ================= BİLEŞENLER ================= */

}

.btn {
  min-height: 48px; padding: 0 16px; border-radius: var(--r6);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--cy-a40); color: var(--cy); background: rgba(var(--ink),.5);
}
.btn:active { background: var(--cy-a10); }

.btn.pri { background: var(--cy); color: var(--bg); border-color: var(--cy); }
.btn.pri:active { background: var(--cy-soft); }
.btn.amb { background: var(--am-a20); color: var(--am); border-color: var(--am); }
.btn.ok { background: rgba(var(--ok-rgb),.12); color: var(--st-done); border-color: var(--st-done); }
.btn.blue { background: rgba(var(--print-rgb),.14); color: var(--st-print); border-color: var(--st-print); }
.btn.ghost { border-color: transparent; background: none; }
.btn.block { width: 100%; }
.btn.invoice-ask { background: var(--am); color: var(--bg); border-color: var(--am); animation: iaPulse .7s ease-in-out infinite alternate; text-transform: none; letter-spacing: .02em; }
:root[data-theme="light"] .btn.invoice-ask { color: #fff; }
a.btn { text-decoration: none; }
body.panel-open #nodes, body.panel-open #center-stats, body.panel-open #stage-top { visibility: hidden; }
.btn.sm { min-height: 40px; font-size: 11px; padding: 0 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.empty { text-align: center; color: var(--tx2); margin: 32px 8px; font-size: 15px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.lbl { font-family: var(--hud); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx2); }
.lbl .req { color: var(--am); }
.inp {
  width: 100%; min-height: 48px; padding: 0 12px; border-radius: var(--r6);
  background: var(--raised); border: 1px solid var(--cy-a20); color: var(--tx); outline: none; font-size: 16px;
}

.err { font-size: 13px; color: var(--am); margin: 2px 0 0; }

.search { position: sticky; top: -12px; z-index: 3; margin: -12px -12px 10px; padding: 12px 12px 8px; background: var(--panel); }
.search .inp { padding-left: 42px; }
.search .s-ic { position: absolute; left: 26px; top: 50%; margin-top: 2px; transform: translateY(-50%); color: var(--tx2); display: flex; }

.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab {
  flex: 1; min-height: 56px; border-radius: var(--r6); border: 1px solid var(--cy-a20); background: rgba(var(--ink),.5);

}

.tab.on { border-color: var(--cy); background: var(--cy-a10); color: var(--cy); box-shadow: inset 0 -2px 0 var(--cy); }

/* Kartlar (2.5D) */
.cards { display: flex; flex-direction: column; gap: 10px; perspective: 1000px; }
.card {

}

@keyframes cardIn { from { opacity: 0; transform: rotateX(4deg) translateY(12px); } to { opacity: 1; transform: rotateX(4deg); } }
.card.s-wait { border-left-color: var(--st-wait); }
.card.s-print { border-left-color: var(--st-print); }
.card.s-done { border-left-color: var(--st-done); }
.c-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.c-main { min-width: 0; flex: 1; }
.c-title { font-weight: 600; font-size: 17px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub { font-size: 15px; color: var(--tx2); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-meta { font-size: 13px; color: var(--tx2); margin: 6px 0 0; }

}
.st-wait { color: var(--st-wait); } .st-print { color: var(--st-print); } .st-done { color: var(--st-done); } .st-arch { color: var(--st-arch); }

.fab {
  position: absolute; right: 16px; bottom: calc(16px + var(--sab)); z-index: 6; min-height: 56px; padding: 0 20px;
  border-radius: 28px; background: var(--am); color: var(--bg); display: flex; align-items: center; gap: 6px;
  font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;

}

/* Alt sayfa (bottom sheet) */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(var(--ink),.72); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 150ms ease-out both; }

.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100% - var(--sat) - 24px);
  background: var(--panel); border: 1px solid var(--cy-a40); border-bottom: 0;
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  display: flex; flex-direction: column; overflow: hidden; animation: sheetIn 180ms ease-out both;
}
.sheet::after {
  content: ''; position: absolute; left: 0; right: 0; top: -120px; height: 120px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--cy) 50%, transparent); opacity: .04; animation: scan 7s linear infinite;
}
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
.sh-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; min-height: 60px; border-bottom: 1px solid var(--cy-a20); }
.sh-title { flex: 1; min-width: 0; font-size: 15px; color: var(--cy); }

.sh-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }

.sh-foot .btn.wide { flex: 2; }

/* Çekmece (drawer) */
.drw-sel { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0; }
.drw-sel:empty { display: none; }
.drw-chip { min-height: 40px; padding: 0 6px 0 12px; border-radius: 20px; border: 1px solid var(--cy); color: var(--cy); background: var(--cy-a10); display: inline-flex; align-items: center; gap: 4px; font-size: 15px; }
.drw-chip i { font-style: normal; font-size: 18px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
.drw-search { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 10px 16px 8px; }
.drw-list { overflow-y: auto; padding: 0 8px 16px; }

.drw-row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 4px 8px; border-radius: var(--r6); text-align: left; color: var(--tx); font-size: 16px; }
.drw-row:active { background: var(--cy-a10); }
.drw-row .thumb { width: 44px; height: 44px; border-radius: var(--r6); background: var(--raised); border: 1px solid var(--cy-a20); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--tx2); }
.drw-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.drw-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbox { width: 24px; height: 24px; border-radius: 4px; border: 2px solid var(--cy-a40); display: flex; align-items: center; justify-content: center; color: var(--bg); }
.drw-row.sel .cbox { background: var(--cy); border-color: var(--cy); }
.drw-new { color: var(--am); }

/* Anahtar (switch) 64x48 */
.sw { width: 64px; height: 48px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sw i { position: relative; width: 52px; height: 28px; border-radius: 14px; background: var(--raised); border: 1px solid var(--cy-a40); transition: background 150ms; }
.sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--tx2); transition: transform 150ms, background 150ms; }
.sw.on i { background: var(--cy-a20); border-color: var(--cy); }
.sw.on i::after { transform: translateX(24px); background: var(--cy); }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 4px 8px 14px; background: var(--raised); border: 1px solid var(--cy-a20); border-radius: var(--r6); }
.set-row .grow { flex: 1; }
.set-row b { display: block; font-weight: 600; }
.set-row span { font-size: 14px; color: var(--tx2); }

/* Toast */
#toast-root { position: fixed; left: 0; right: 0; bottom: calc(88px + var(--sab)); z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
.toast {
  max-width: 420px; width: 100%; padding: 12px 16px; border-radius: var(--r6); pointer-events: auto;
  background: var(--raised); border: 1px solid var(--cy); color: var(--tx); font-size: 15px; text-align: center;
  box-shadow: 0 0 16px var(--cy-a20); animation: fadeIn 150ms ease-out both;
}
.toast.t-err { border-color: var(--red); box-shadow: 0 0 16px rgba(var(--red-rgb),.25); }
.toast.t-info { border-color: var(--am); }
.toast.undo { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 4px 4px 4px 16px; }
.toast.undo .btn { min-height: 44px; }

/* Kumaş topu */
.sec { border: 1px solid var(--cy-a20); border-radius: var(--r12); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: rgba(var(--ink),.35); }

.sec-t { margin: 0; font-size: 12px; color: var(--cy); }
.sec.sec-un .sec-t { color: var(--am); }
.unit-row { display: flex; gap: 8px; }
.unit-btn { flex: 1; min-height: 48px; border-radius: var(--r6); border: 1px solid var(--cy-a20); color: var(--tx2); font-family: var(--hud); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.unit-btn.on-mt { border-color: var(--cy); color: var(--cy); background: var(--cy-a10); }
.unit-btn.on-kg { border-color: var(--am); color: var(--am); background: var(--am-a20); }
.roll-in { display: flex; gap: 8px; }

.roll-in .cnt { min-width: 52px; min-height: 48px; display: none; align-items: center; justify-content: center; border-radius: var(--r6); border: 1px solid var(--cy-a20); font-family: var(--hud); font-weight: 600; font-size: 11px; color: var(--tx2); }

.roll-g { font-size: 13px; color: var(--tx2); margin: 2px 0 0; }
.roll-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rchip { min-height: 44px; border-radius: var(--r6); border: 1px solid; display: flex; align-items: center; justify-content: space-between; gap: 0; padding: 0 0 0 8px; font-size: 14px; font-weight: 600; touch-action: manipulation; }
.rchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rchip.mt { color: var(--cy); border-color: var(--cy-a40); background: var(--cy-a10); }
.rchip.kg { color: var(--am); border-color: rgba(var(--am-rgb),.5); background: var(--am-a20); }
.rchip.sel { outline: 2px solid var(--tx); outline-offset: 1px; }
.rchip .x { min-width: 32px; min-height: 42px; display: flex; align-items: center; justify-content: center; color: inherit; opacity: .8; }
.rchip input { width: 100%; background: transparent; border: 0; outline: none; color: inherit; font-weight: 600; font-size: 16px; min-height: 40px; }
.totals { border: 1px solid var(--cy-a20); border-radius: var(--r6); padding: 8px 12px; font-size: 15px; }
.totals div { display: flex; justify-content: space-between; padding: 2px 0; }
.totals .t-mt { color: var(--cy); } .totals .t-kg { color: var(--am); }
.totals .t-all { border-top: 1px solid var(--cy-a20); margin-top: 4px; padding-top: 6px; font-weight: 600; }
.grp { border: 1px solid var(--cy-a20); border-radius: var(--r6); background: var(--raised); }
.grp-top { display: flex; align-items: center; gap: 2px; padding: 4px; }
.grp-name { flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px; text-align: left; color: var(--tx); font-weight: 600; }
.grp-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp-tot { font-size: 14px; color: var(--cy); white-space: nowrap; }
.grp-body { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.grand { border: 1px solid var(--cy); border-radius: var(--r6); background: var(--cy-a10); padding: 12px; }
.grand b { font-family: var(--hud); font-weight: 600; font-size: 20px; color: var(--cy); }
.grand p { margin: 4px 0 0; font-size: 13px; color: var(--tx2); }

/* Fotoğraf */
.ph-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1 / 1; border-radius: var(--r6); overflow: hidden; background: var(--raised); border: 1px solid var(--cy-a20); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .x { position: absolute; top: 2px; right: 2px; width: 40px; height: 40px; border-radius: 50%; background: rgba(var(--ink),.75); color: var(--tx); display: flex; align-items: center; justify-content: center; }
.ph .ed { left: 2px; right: auto; }
.pat-name { font-size: 14px; text-align: center; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick { width: 88px; height: 88px; flex-shrink: 0; border-radius: var(--r6); border: 1px dashed var(--cy-a40); background: var(--raised); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--tx2); }
.pick img { width: 100%; height: 100%; object-fit: cover; }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb .ibtn { position: absolute; background: rgba(var(--ink),.6); color: var(--tx); }
.lb .lb-x { top: calc(var(--sat) + 12px); right: 12px; }
.lb .lb-p { left: 8px; top: 50%; transform: translateY(-50%); }
.lb .lb-n { right: 8px; top: 50%; transform: translateY(-50%); }
.lb .lb-c { position: absolute; bottom: calc(var(--sab) + 20px); left: 50%; transform: translateX(-50%); font-family: var(--hud); font-weight: 600; color: var(--tx2); }

/* Özet */
.info { background: var(--raised); border: 1px solid var(--cy-a20); border-radius: var(--r6); padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.info .h { text-align: center; color: var(--cy); font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--cy-a20); margin: 0 0 4px; }
.info .r { display: flex; gap: 6px; } .info .r span:first-child { color: var(--tx2); flex-shrink: 0; }
.ig { border: 1px solid var(--cy-a20); border-radius: var(--r6); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.ig.un { border-color: rgba(var(--am-rgb),.45); }
.ig-t { margin: 0; font-weight: 600; font-size: 14px; }
.ig-chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.ig-chips div { border: 1px solid; border-radius: 4px; text-align: center; font-size: 13px; padding: 2px; overflow: hidden; }
.ig-chips .mt { color: var(--cy); border-color: var(--cy-a40); } .ig-chips .kg { color: var(--am); border-color: rgba(var(--am-rgb),.5); }
.ig small { color: var(--tx2); font-size: 13px; }
.storage-bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; border: 1px solid var(--cy-a20); }
.storage-bar i { display: block; height: 100%; background: var(--cy); }
.blk { background: var(--raised); border: 1px solid var(--cy-a20); border-radius: var(--r6); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.blk h3 { margin: 0; font-size: 13px; color: var(--cy); }
.blk p { margin: 0; color: var(--tx2); font-size: 15px; }
.contact { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.contact .line { width: 100%; display: flex; gap: 8px; align-items: center; color: var(--tx2); font-size: 15px; }
.sortbar { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; }
.sortbar .btn { flex-shrink: 0; }
.sortbar .btn.on { background: var(--cy-a10); border-color: var(--cy); }

/* ================= UZAY KEDİSİ ================= */
#fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.star { position: absolute; left: 0; top: 0; width: 120px; height: 3px; transform-origin: 100% 50%; opacity: 0; }
.star::before { content: ''; position: absolute; inset: 0; border-radius: 2px; background: linear-gradient(to right, transparent, var(--cy)); }
.star::after { content: ''; position: absolute; right: -4px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--tx); box-shadow: 0 0 8px var(--am), 0 0 16px var(--am); }
#cat { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.12); pointer-events: none; }
#cat.live { pointer-events: auto; }
#cat .eye { animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

/* Oyun */
.game-wrap { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.game-hud { display: flex; justify-content: space-between; padding: 8px 14px; font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: .08em; color: var(--tx2); text-transform: uppercase; }
.game-hud b { color: var(--am); }
.game-cv { flex: 1; min-height: 0; position: relative; touch-action: none; }
.game-cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.game-over { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(var(--ink),.82); text-align: center; padding: 24px; }
.game-over h2 { margin: 0; color: var(--cy); font-size: 22px; }
.game-over p { margin: 0; color: var(--tx2); }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .panel::after, .sheet::after { display: none; }
}
@media (min-width: 640px) { .ov { align-items: center; } .sheet { border-bottom: 1px solid var(--cy-a40); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); } }
</style>

<script>
'use strict';
/* =====================================================================
   VERİ
   - Tüm kayıtlar IndexedDB'de tutulur (Store adaptörü). IndexedDB yoksa
     bellek içi yedek devreye girer ve kullanıcı uyarılır.
   - Fotoğraflar müşteri kaydının içinde DEĞİL, ayrı "photos" deposunda
     tutulur; işte yalnızca fotoğraf kimliği (id) saklanır. Eski sürümdeki
     "localStorage doldu, kayıt sessizce başarısız oldu" sorununun çözümü budur.
   - Her yazma işleminin sonucu kontrol edilir; hata olursa kullanıcı görür.
   ===================================================================== */
var APP_VERSION = '2.12.1';
var SCHEMA_VERSION = 2; // 1 = eski localStorage sürümü (MİT 1.0), 2 = IndexedDB

var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtNum(n) { var r = Math.round((n || 0) * 100) / 100; return String(r).replace('.', ','); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString('tr-TR'); } catch (e) { return ''; } }
function low(s) { return String(s || '').toLocaleLowerCase('tr-TR'); }
function byName(a, b) { return String(a).localeCompare(String(b), 'tr'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isDataUrl(s) { return typeof s === 'string' && s.indexOf('data:') === 0; }

/* ---------- Depolama adaptörü ---------- */
var Store = {
  db: null,
  mem: null, // bellek içi yedek: { storeName: { id: value } }
  STORES: ['customers', 'photos', 'patterns', 'meta'],

  init: function () {
    var self = this;
    return new Promise(function (resolve) {
      if (!window.indexedDB) { self.useMemory(); resolve(false); return; }
      var req;
      try { req = indexedDB.open('mit_holo', 1); } catch (e) { self.useMemory(); resolve(false); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        self.STORES.forEach(function (s) {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
        });
      };
      req.onsuccess = function () {
        self.db = req.result;
        self.db.onversionchange = function () { self.db.close(); };
        resolve(true);
      };
      req.onerror = function () { self.useMemory(); resolve(false); };
      req.onblocked = function () { self.useMemory(); resolve(false); };
    });
  },
  useMemory: function () {
    var m = {};
    this.STORES.forEach(function (s) { m[s] = {}; });
    this.mem = m;
  },
  _tx: function (store, mode, fn) {
    var self = this;
    return new Promise(function (resolve, reject) {
      var tx, out;
      try { tx = self.db.transaction(store, mode); } catch (e) { reject(e); return; }
      var os = tx.objectStore(store);
      try { out = fn(os); } catch (e) { reject(e); return; }
      tx.oncomplete = function () { resolve(out && 'result' in out ? out.result : undefined); };
      tx.onerror = function () { reject(tx.error || new Error('Veritabanı hatası')); };
      tx.onabort = function () { reject(tx.error || new Error('Yazma iptal edildi (depolama dolu olabilir)')); };
    });
  },
  getAll: function (store) {
    if (this.mem) { var o = this.mem[store]; return Promise.resolve(Object.keys(o).map(function (k) { return clone(o[k]); })); }
    return this._tx(store, 'readonly', function (os) { return os.getAll(); });
  },
  get: function (store, id) {
    if (this.mem) { var v = this.mem[store][id]; return Promise.resolve(v ? clone(v) : undefined); }
    return this._tx(store, 'readonly', function (os) { return os.get(id); });
  },
  put: function (store, val) {
    if (this.mem) { this.mem[store][val.id] = clone(val); return Promise.resolve(); }
    return this._tx(store, 'readwrite', function (os) { os.put(val); });
  },
  putMany: function (store, vals) {
    if (!vals.length) return Promise.resolve();
    if (this.mem) { var m = this.mem[store]; vals.forEach(function (v) { m[v.id] = clone(v); }); return Promise.resolve(); }
    return this._tx(store, 'readwrite', function (os) { vals.forEach(function (v) { os.put(v); }); });
  },
  del: function (store, id) {
    if (this.mem) { delete this.mem[store][id]; return Promise.resolve(); }
    return this._tx(store, 'readwrite', function (os) { os.delete(id); });
  },
  keys: function (store) {
    if (this.mem) return Promise.resolve(Object.keys(this.mem[store]));
    return this._tx(store, 'readonly', function (os) { return os.getAllKeys(); });
  }
};

/* ---------- Fotoğraflar (ayrı depo + önbellek) ---------- */
var Photos = {
  cache: {},
  save: function (dataUrl) {
    var id = 'ph_' + uid();
    this.cache[id] = dataUrl;
    return Store.put('photos', { id: id, data: dataUrl, at: new Date().toISOString() }).then(function () { return id; });
  },
  get: function (id) {
    if (isDataUrl(id)) return Promise.resolve(id);
    if (this.cache[id]) return Promise.resolve(this.cache[id]);
    var self = this;
    return Store.get('photos', id).then(function (r) {
      if (r && r.data) self.cache[id] = r.data;
      return r ? r.data : null;
    });
  },
  getMany: function (ids) { var self = this; return Promise.all(ids.map(function (id) { return self.get(id); })); },
  // <img data-pid="..."> etiketlerinin kaynağını sonradan doldurur
  hydrate: function (root) {
    var self = this;
    Array.prototype.forEach.call((root || document).querySelectorAll('img[data-pid]:not([src])'), function (img) {
      self.get(img.getAttribute('data-pid')).then(function (d) { if (d) img.src = d; }).catch(function () {});
    });
  }
};

/* ---------- Ayarlar ve meta ---------- */
var Settings = { sound: true, vibrate: true, reminder: false, cat: true, autoBackup: true, theme: 'dark', asteroid: true };
/* Tema: koyu (hologram gece) / açık (gün doğumu). Açılışta titreme olmasın diye
   seçim ayrıca localStorage'da tutulur (iş verisi değil, yalnızca görünüm tercihi). */
var Theme = {
  early: function () { try { var t = localStorage.getItem('mit_theme'); if (t === 'light' || t === 'dark') Settings.theme = t; } catch (e) {} this.apply(); },
  apply: function () {
    var light = Settings.theme === 'light';
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', light ? '#FFE9CF' : '#05080F');
    try { localStorage.setItem('mit_theme', Settings.theme); } catch (e) {}
    if (typeof Sphere !== 'undefined' && Sphere.ok) { if (typeof Impact !== 'undefined') Impact.reset(); Sphere.applyTheme(); }
  }
};
var Meta = {
  get: function (key) { return Store.get('meta', key).then(function (r) { return r ? r.value : undefined; }); },
  set: function (key, value) { return Store.put('meta', { id: key, value: value }); }
};

/* ---------- Model ---------- */
function emptyPatternGroup(name) { return { id: uid(), patternName: name || '', fabricRolls: [] }; }
function emptyJob() {
  return {
    id: uid(), createdAt: new Date().toISOString(), status: 'active', deliveredAt: null, printed: false,
    patternGroups: [emptyPatternGroup()], unassignedRolls: [], photos: [], notes: '',
    fabricType: '', fabricColor: '', fabricGramsPerMeter: null
  };
}
function emptyCustomer() {
  var now = new Date().toISOString();
  return { id: uid(), name: '', phone: '', address: '', location: null, createdAt: now, updatedAt: now, jobs: [] };
}
function normRolls(arr) {
  return (Array.isArray(arr) ? arr : []).filter(function (r) { return r && isFinite(Number(r.value)); }).map(function (r) {
    return { id: r.id || uid(), value: Number(r.value), unit: r.unit === 'kg' ? 'kg' : 'mt' };
  });
}
// Her sürümden gelen iş kaydını güncel şemaya çevirir (alan kaybı olmadan)
function normalizeJob(j) {
  j = Object.assign({}, j);
  j.id = j.id || uid();
  j.createdAt = j.createdAt || new Date().toISOString();
  j.status = j.status === 'delivered' ? 'delivered' : 'active';
  j.deliveredAt = j.deliveredAt || null;
  j.printed = !!j.printed;
  if (!Array.isArray(j.patternGroups)) {
    // En eski sürüm: işin adı + tek top listesi
    j.patternGroups = [{ id: uid(), patternName: j.name || '', fabricRolls: normRolls(j.fabricRolls) }];
  } else {
    j.patternGroups = j.patternGroups.map(function (g) {
      return Object.assign({}, g, { id: g.id || uid(), patternName: g.patternName || '', fabricRolls: normRolls(g.fabricRolls) });
    });
  }
  if (!j.patternGroups.length) j.patternGroups = [emptyPatternGroup()];
  j.unassignedRolls = normRolls(j.unassignedRolls);
  j.photos = Array.isArray(j.photos) ? j.photos.filter(function (p) { return typeof p === 'string' && p; }) : [];
  j.notes = j.notes || '';
  j.fabricType = j.fabricType || '';
  j.fabricColor = j.fabricColor || '';
  j.fabricGramsPerMeter = j.fabricGramsPerMeter ? Number(j.fabricGramsPerMeter) : null;
  return j;
}
function normalizeCustomer(c) {
  c = Object.assign({}, c);
  c.id = c.id || uid();
  c.name = String(c.name || 'İsimsiz Müşteri');
  c.phone = c.phone || '';
  c.address = c.address || '';
  c.location = c.location && isFinite(c.location.lat) ? { lat: c.location.lat, lng: c.location.lng } : null;
  c.createdAt = c.createdAt || new Date().toISOString();
  c.updatedAt = c.updatedAt || c.createdAt;
  c.jobs = (Array.isArray(c.jobs) ? c.jobs : []).map(normalizeJob);
  return c;
}

/* ---------- Kumaş hesaplama (eski sürümle birebir) ---------- */
function calcRollTotals(rolls, gramsPerMeter) {
  var mt = 0, kg = 0;
  rolls.forEach(function (r) { if (r.unit === 'mt') mt += r.value; else kg += r.value; });
  var eq = (gramsPerMeter && gramsPerMeter > 0) ? (kg * 1000) / gramsPerMeter : 0;
  return {
    meterRolls: rolls.filter(function (r) { return r.unit === 'mt'; }),
    kgRolls: rolls.filter(function (r) { return r.unit === 'kg'; }),
    totalMeters: mt, totalKg: kg, kgEquivalentMeters: eq, grandTotalMeters: mt + eq
  };
}
function jobAllRolls(job) {
  var all = job.unassignedRolls.slice();
  job.patternGroups.forEach(function (g) { all = all.concat(g.fabricRolls); });
  return all;
}
function calcJobTotals(job) { return calcRollTotals(jobAllRolls(job), job.fabricGramsPerMeter); }
function jobDisplayName(job) {
  var names = job.patternGroups.map(function (g) { return (g.patternName || '').trim(); }).filter(Boolean);
  if (!names.length) return 'İsimsiz Kalıp';
  if (job.patternGroups.length === 1) return names[0];
  return names[0] + ' +' + (job.patternGroups.length - 1) + ' diğer';
}
function jobStatusKey(job) { return job.status === 'delivered' ? 'done' : (job.printed ? 'print' : 'wait'); }
function jobStatusLabel(job) { return job.status === 'delivered' ? 'Teslim Edildi' : (job.printed ? 'Baskı Yapıldı' : 'Baskı Bekliyor'); }
function periodStart(period) {
  var now = new Date();
  if (period === 'month') return new Date(now.getFullYear(), now.getMonth(), 1);
  var day = now.getDay();
  var diff = day === 0 ? 6 : day - 1;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff);
}

/* ---------- Uygulama verisi ---------- */
var Data = {
  customers: [],
  patterns: [],
  storageOk: true,

  load: function () {
    var self = this;
    return Promise.all([Store.getAll('customers'), Store.getAll('patterns')]).then(function (r) {
      self.customers = (r[0] || []).map(normalizeCustomer);
      self.patterns = (r[1] || []).filter(function (p) { return p && p.name; });
    });
  },
  find: function (id) {
    for (var i = 0; i < this.customers.length; i++) if (this.customers[i].id === id) return this.customers[i];
    return null;
  },
  findJob: function (cid, jid) {
    var c = this.find(cid);
    if (!c) return null;
    for (var i = 0; i < c.jobs.length; i++) if (c.jobs[i].id === jid) return c.jobs[i];
    return null;
  },
  activeJobs: function () {
    var out = [];
    this.customers.forEach(function (c) { c.jobs.forEach(function (j) { if (j.status === 'active') out.push({ job: j, customer: c }); }); });
    return out;
  },
  deliveredJobs: function () {
    var out = [];
    this.customers.forEach(function (c) { c.jobs.forEach(function (j) { if (j.status === 'delivered') out.push({ job: j, customer: c }); }); });
    return out;
  },
  periodMeters: function (period) {
    var start = periodStart(period), total = 0;
    this.customers.forEach(function (c) { c.jobs.forEach(function (j) { if (new Date(j.createdAt) >= start) total += calcJobTotals(j).grandTotalMeters; }); });
    return total;
  },
  totalJobs: function () { return this.customers.reduce(function (s, c) { return s + c.jobs.length; }, 0); },

  // Yazma hatası kullanıcıya gösterilir; bellek içi durum korunur.
  _fail: function (err) {
    console.error(err);
    UI.toast('Kayıt yazılamadı: ' + (err && err.message ? err.message : 'depolama hatası'), 'err');
    throw err;
  },
  _changed: function () { AutoBackup.dirty = true; App.refreshStats(); },
  saveCustomer: function (c) {
    c.updatedAt = new Date().toISOString();
    var idx = -1;
    for (var i = 0; i < this.customers.length; i++) if (this.customers[i].id === c.id) idx = i;
    if (idx < 0) this.customers.push(c); else this.customers[idx] = c;
    var self = this;
    return Store.put('customers', clone(c)).then(function () { self._changed(); }, function (e) { self._fail(e); });
  },
  deleteCustomer: function (id) {
    this.customers = this.customers.filter(function (c) { return c.id !== id; });
    var self = this;
    return Store.del('customers', id).then(function () { self._changed(); }, function (e) { self._fail(e); });
  },
  savePattern: function (p) {
    var idx = -1;
    for (var i = 0; i < this.patterns.length; i++) if (this.patterns[i].id === p.id) idx = i;
    if (idx < 0) this.patterns.push(p); else this.patterns[idx] = p;
    var self = this;
    return Store.put('patterns', p).then(function () { self._changed(); }, function (e) { self._fail(e); });
  },
  deletePattern: function (id) {
    this.patterns = this.patterns.filter(function (p) { return p.id !== id; });
    var self = this;
    return Store.del('patterns', id).then(function () { self._changed(); }, function (e) { self._fail(e); });
  },

  /* İçe aktarma: yalnızca eksik müşteri/iş/kalıp eklenir, mevcut kayıt
     hiçbir zaman silinmez veya üzerine yazılmaz (eski sürümle aynı kural). */
  importData: function (customersIn, patternsIn) {
    var self = this;
    var changed = {}, addedCustomers = 0, addedJobs = 0, addedPatterns = 0;
    var photoJobs = []; // fotoğrafı dataURL olan işler (ayrı depoya taşınacak)

    (customersIn || []).forEach(function (raw) {
      if (!raw || typeof raw !== 'object') return;
      var bc = normalizeCustomer(raw);
      var existing = self.find(bc.id);
      if (!existing) {
        self.customers.push(bc);
        changed[bc.id] = bc;
        addedCustomers++; addedJobs += bc.jobs.length;
        bc.jobs.forEach(function (j) { photoJobs.push(j); });
        return;
      }
      var have = {};
      existing.jobs.forEach(function (j) { have[j.id] = true; });
      bc.jobs.forEach(function (bj) {
        if (have[bj.id]) return;
        existing.jobs.push(bj);
        changed[existing.id] = existing;
        addedJobs++;
        photoJobs.push(bj);
      });
    });

    var names = {};
    self.patterns.forEach(function (p) { names[low(p.name)] = true; });
    var newPatterns = [];
    (patternsIn || []).forEach(function (p) {
      if (!p || !p.name || names[low(p.name)]) return;
      names[low(p.name)] = true;
      var np = { id: p.id && !self.patterns.some(function (x) { return x.id === p.id; }) ? p.id : uid(), name: String(p.name), photo: isDataUrl(p.photo) ? p.photo : null };
      newPatterns.push(np);
      self.patterns.push(np);
      addedPatterns++;
    });

    // Fotoğrafları sırayla ayrı depoya yaz, işte yalnızca id kalsın
    var chain = Promise.resolve();
    photoJobs.forEach(function (j) {
      j.photos.forEach(function (p, i) {
        if (!isDataUrl(p)) return;
        chain = chain.then(function () { return Photos.save(p).then(function (id) { j.photos[i] = id; }); });
      });
    });
    return chain.then(function () {
      var list = Object.keys(changed).map(function (k) { return clone(changed[k]); });
      return Store.putMany('customers', list);
    }).then(function () {
      return Store.putMany('patterns', newPatterns);
    }).then(function () {
      self._changed();
      return { customers: addedCustomers, jobs: addedJobs, patterns: addedPatterns };
    }, function (e) { self._fail(e); });
  },

  /* Yedek: fotoğraflar dosyanın içine gömülür (eski uygulama da açabilir) */
  buildBackup: function () {
    var self = this;
    var customers = clone(self.customers);
    var chain = Promise.resolve();
    customers.forEach(function (c) {
      c.jobs.forEach(function (j) {
        chain = chain.then(function () {
          return Photos.getMany(j.photos).then(function (arr) { j.photos = arr.filter(Boolean); });
        });
      });
    });
    return chain.then(function () {
      return {
        appName: 'MIT', version: SCHEMA_VERSION, appVersion: APP_VERSION,
        exportedAt: new Date().toISOString(), customers: customers, patterns: clone(self.patterns)
      };
    });
  }
};

/* ---------- Şema göçü ----------
   v1 (eski MİT, localStorage) → v2 (IndexedDB). Aynı tarayıcıda/kaynakta eski
   veriler varsa birleştirilerek aktarılır. localStorage'daki eski veri SİLİNMEZ. */
function runMigrations() {
  return Meta.get('schemaVersion').then(function (v) {
    v = v || 1;
    var chain = Promise.resolve();
    if (v < 2) {
      chain = chain.then(function () {
        var cs = [], ps = [];
        try { cs = JSON.parse(localStorage.getItem('mit_customers_v1') || '[]'); } catch (e) {}
        try { ps = JSON.parse(localStorage.getItem('mit_patterns_v1') || '[]'); } catch (e) {}
        if ((Array.isArray(cs) && cs.length) || (Array.isArray(ps) && ps.length)) {
          return Data.importData(Array.isArray(cs) ? cs : [], Array.isArray(ps) ? ps : []).then(function (r) {
            if (r && (r.customers || r.jobs)) UI.toast('Eski kayıtlar aktarıldı: ' + r.customers + ' müşteri, ' + r.jobs + ' iş');
          });
        }
      });
    }
    return chain.then(function () { if (v !== SCHEMA_VERSION) return Meta.set('schemaVersion', SCHEMA_VERSION); });
  });
}

/* Hiçbir işe bağlı olmayan ve 2 günden eski fotoğrafları temizler
   (silinen işlerin geri alma süresi çoktan dolmuştur). */
function cleanOrphanPhotos() {
  var used = {};
  Data.customers.forEach(function (c) { c.jobs.forEach(function (j) { j.photos.forEach(function (p) { used[p] = true; }); }); });
  if (typeof JF !== 'undefined' && JF && JF.draft) JF.draft.photos.forEach(function (p) { used[p] = true; });
  var limit = Date.now() - 2 * 24 * 3600 * 1000;
  return Store.getAll('photos').then(function (all) {
    var chain = Promise.resolve();
    (all || []).forEach(function (p) {
      if (used[p.id]) return;
      if (p.at && new Date(p.at).getTime() > limit) return;
      chain = chain.then(function () { return Store.del('photos', p.id); });
    });
    return chain;
  }).catch(function (e) { console.warn('fotoğraf temizliği atlandı', e); });
}

/* ---------- Görsel sıkıştırma ---------- */
function compressDataUrl(src, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onerror = function () { reject(new Error('Görsel yüklenemedi')); };
    img.onload = function () {
      var w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.src = src;
  });
}
function compressFile(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onerror = function () { reject(new Error('Dosya okunamadı')); };
    r.onload = function () { compressDataUrl(String(r.result), maxDim, quality).then(resolve, reject); };
    r.readAsDataURL(file);
  });
}

/* ---------- Native (APK) köprüsü ---------- */
function isNative() { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function plugin(name) { return window.Capacitor && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] : null; }
function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onerror = function () { reject(new Error('Dosya okunamadı')); };
    r.onload = function () { var s = String(r.result); var i = s.indexOf(','); resolve(i >= 0 ? s.slice(i + 1) : s); };
    r.readAsDataURL(blob);
  });
}
function nativeShareFile(filename, data, encoding, title) {
  var fs = plugin('Filesystem'), sh = plugin('Share');
  var opts = { path: filename, data: data, directory: 'CACHE', recursive: true };
  if (encoding) opts.encoding = encoding;
  return fs.writeFile(opts).then(function () {
    return fs.getUri({ path: filename, directory: 'CACHE' });
  }).then(function (u) {
    return sh.share({ title: title, files: [u.uri] }).then(function () { return 'shared'; }, function () { return 'prepared'; });
  });
}
// Dosyayı paylaş / indir. iframe önizlemesinde indirme kapalıdır.
function shareOrDownload(blob, filename, title) {
  if (isNative() && plugin('Filesystem') && plugin('Share')) {
    return blobToBase64(blob).then(function (b64) { return nativeShareFile(filename, b64, null, title); });
  }
  var file = null;
  try { file = new File([blob], filename, { type: blob.type }); } catch (e) {}
  if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: title }).then(function () { return 'shared'; }, function () { return 'prepared'; });
  }
  if (IN_FRAME) return Promise.resolve('blocked');
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  return Promise.resolve('downloaded');
}
function nativePickPhoto(source) {
  return plugin('Camera').getPhoto({ quality: 70, width: 1000, resultType: 'dataUrl', source: source, saveToGallery: false })
    .then(function (r) { return compressDataUrl(r.dataUrl, 800, 0.7); });
}

   SES
   WebAudio ile üretilir; dosya yok. İlk dokunuştan sonra başlar.
   ===================================================================== */
var Sound = {
  ctx: null, master: null,
  unlock: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.15;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  tone: function (freq, dur, type, at, freq2) {
    var c = this.ctx, t = c.currentTime + (at || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (freq2) o.frequency.exponentialRampToValueAtTime(freq2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  play: function (kind) {
    if (!Settings.sound || !this.ctx) return;
    try {
      if (kind === 'tap') this.tone(880, 0.06, 'sine');
      else if (kind === 'open') { this.tone(440, 0.12, 'triangle', 0, 880); this.tone(1320, 0.1, 'sine', 0.08); }
      else if (kind === 'back') this.tone(660, 0.14, 'triangle', 0, 330);
      else if (kind === 'ok') { this.tone(660, 0.08, 'sine'); this.tone(990, 0.12, 'sine', 0.08); }
      else if (kind === 'err') { this.tone(220, 0.25, 'triangle', 0, 160); }
      else if (kind === 'pop') this.tone(520, 0.07, 'sine', 0, 1040);
    } catch (e) {}
  }
};

  if (!Settings.vibrate || !navigator.vibrate) return;
  try { navigator.vibrate(Math.max(10, Math.min(40, ms || 12))); } catch (e) {}
}

      pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(th);
      var isAm = Math.random() < 0.12, cc = isAm ? cAm : cCy;
      this.pAmber = this.pAmber || []; this.pAmber[i] = isAm;
      col[i * 3] = cc.r; col[i * 3 + 1] = cc.g; col[i * 3 + 2] = cc.b;
    }
    var pg = new T.BufferGeometry();
    pg.setAttribute('position', new T.BufferAttribute(pos, 3));
    pg.setAttribute('color', new T.BufferAttribute(col, 3));
    this.particles = new T.Points(pg, new T.PointsMaterial({ size: 0.028, vertexColors: true, transparent: true, opacity: 0.8, blending: T.AdditiveBlending, depthWrite: false }));
    this.scene.add(this.particles);

    // Başlangıç eğimi
    this.globe.quaternion.setFromEuler(new T.Euler(0.35, 0.4, 0));
    this.applyTheme();
  },
  // Koyu: eklemeli parlayan hologram. Açık (gün doğumu): şeffaf zemin, koyu çizgiler, güneş gibi parlayan çekirdek.
  applyTheme: function () {
    if (!this.renderer) return;
    var T = THREE, light = Settings.theme === 'light';
    var blend = light ? T.NormalBlending : T.AdditiveBlending;
    var CY = light ? 0x00739e : 0x00e5ff, SOFT = light ? 0x1b8fbf : 0x4dd8f0, AM = light ? 0xd96f00 : 0xffb300;
    this.renderer.setClearColor(0x05080f, light ? 0 : 1);
    this.core.material.color.setHex(CY); this.core.material.opacity = light ? 0.5 : 0.35;
    this.surf.material.color.setHex(SOFT); this.surf.material.opacity = light ? 0.16 : 0.09;
    this.light.material.color.setHex(light ? 0xff9a1f : 0xffb300);
    this.light.scale.setScalar(1);
    this.halo.material.blending = blend; this.halo.material.opacity = light ? 1 : 1;
    this.haloBase = light ? 1.5 : 0.8;
    var self = this;
    this.rings.forEach(function (r) {
      r.mesh.material.color.setHex(r.amber ? AM : CY);
      r.mesh.material.blending = blend; r.mesh.material.opacity = light ? 0.75 : 0.85;
      r.mesh.material.needsUpdate = true;
    });
    var col = this.particles.geometry.getAttribute('color'), cA = new T.Color(AM), cC = new T.Color(SOFT);
    for (var i = 0; i < col.count; i++) { var c = this.pAmber[i] ? cA : cC; col.setXYZ(i, c.r, c.g, c.b); }
    col.needsUpdate = true;
    this.particles.material.blending = blend; this.particles.material.opacity = light ? 0.55 : 0.8;
    this.particles.material.needsUpdate = true; this.halo.material.needsUpdate = true;
    if (!this.running) this.renderOnce();
  },

  resize: function () {
    if (!this.ok) return;
    if (UI.panelOpen() || Game.active) { this.pendingResize = true; return; }
    this.pendingResize = false;
    var w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = aspect;
    this.baseZ = Math.max(3.2, 1.42 / (Math.tan(25 * Math.PI / 180) * aspect));
    this.camZ = this.baseZ;
    this.camera.position.set(0, 0, this.camZ);
    this.camera.updateProjectionMatrix();
    if (!this.running) this.renderOnce();
  },

  bindInput: function () {
    var self = this, stage = document.getElementById('stage');
    stage.addEventListener('pointerdown', function (e) {
      if (self.busy || UI.panelOpen() || Orbit.phase === 'fly' || Orbit.phase === 'chaos') return;
      self.drag = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      self.moved = false; self.vx = self.vy = 0; self.lastInput = performance.now();
    });
    window.addEventListener('pointermove', function (e) {
      if (Orbit.move(e)) return; // tutulan düğüm parmakla taşınıyor
      var d = self.drag;
      if (!d || d.id !== e.pointerId) return;
      var dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (!self.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
      self.moved = true;
      var now = performance.now(), dt = Math.max(1, now - d.t);
      var ay = dx * 0.006, ax = dy * 0.006;
      self.rotate(ax, ay);
      self.vx = ax / dt * 16; self.vy = ay / dt * 16;
      d.x = e.clientX; d.y = e.clientY; d.t = now;
      self.lastInput = now;
    });
    function end(e) {
      if (!self.drag || self.drag.id !== e.pointerId) return;
      self.drag = null; self.lastInput = performance.now();
      if (performance.now() - (self._lastMoveT || 0) > 80) { /* durunca atalet yok */ }
    }
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  },
  rotate: function (ax, ay) {
    var T = THREE, q = new T.Quaternion();
    q.setFromAxisAngle(new T.Vector3(0, 1, 0), ay); this.globe.quaternion.premultiply(q);
    q.setFromAxisAngle(new T.Vector3(1, 0, 0), ax); this.globe.quaternion.premultiply(q);
  },

  start: function () {
    if (!this.ok || this.running) return;
    this.running = true;
    this.last = performance.now(); this.fpsT = this.last; this.frames = 0;
    var self = this;
    (function loop(now) {
      if (!self.running) return;
      self.frame(now);
      self.raf = requestAnimationFrame(loop);
    })(this.last);
  },
  stop: function () { this.running = false; if (this.raf) cancelAnimationFrame(this.raf); },

  frame: function (now) {
    var dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    // Atalet + otomatik dönüş
    if (!this.drag && !this.anim) {
      if (Math.abs(this.vx) + Math.abs(this.vy) > 0.00005) {
        this.rotate(this.vx, this.vy);
        this.vx *= 0.95; this.vy *= 0.95;
      } else if (!REDUCED && now - this.lastInput > 1500) {
        this.rotate(0, 0.1 * dt);
      }
    }
    if (this.anim) this.stepAnim(now);
    Impact.update(dt);
    Orbit.step(dt);
    var t = now / 1000;
    this.core.rotation.y += dt * 0.15; this.core.rotation.x += dt * 0.05;
    var wob = this.wobble || 0;
    this.rings[0].mesh.rotation.z += dt * this.rings[0].speed * (1 + wob * 18);
    this.rings[1].mesh.rotation.z += dt * this.rings[1].speed * (1 + wob * 18);
    this.rings[0].mesh.position.set(Math.sin(t * 9) * 0.08 * wob, Math.cos(t * 7) * 0.08 * wob, 0);
    this.rings[1].mesh.position.set(Math.cos(t * 8) * 0.1 * wob, Math.sin(t * 6) * 0.1 * wob, 0);
    this.particles.rotation.y += dt * 0.012;
    var p = 1 + 0.12 * Math.sin(t * Math.PI * 2 / 4);
    this.light.scale.setScalar(p);
    var hb = this.haloBase || 0.8;
    this.halo.scale.set(hb * p, hb * p, 1);
    this.renderer.render(this.scene, this.camera);
    this.projectNodes();
    // Performans: 2 sn ortalaması 45 fps altıysa kademeli düşür
    this.frames++;
    if (now - this.fpsT >= 2000) {
      var fps = this.frames * 1000 / (now - this.fpsT);
      this.frames = 0; this.fpsT = now;
      if (fps < 45 && this.perfLevel < 2 && !this.anim && !Impact.active() && !Orbit.active()) {
        this.perfLevel++;
        if (this.perfLevel === 1) this.particles.geometry.setDrawRange(0, 300);
        else { this.renderer.setPixelRatio(1); this.resize(); }
      }
    }
  },
  renderOnce: function () { if (this.ok) { this.renderer.render(this.scene, this.camera); this.projectNodes(); } },

  projectNodes: function () {
    var T = THREE, w = window.innerWidth, h = window.innerHeight;
    var v = new T.Vector3(), best = -2, bestI = -1;
    for (var i = 0; i < this.nodeEls.length; i++) {
      var nv = this.nodeVecs[i];
      v.set(nv[0], nv[1], nv[2]);
      if (Impact.spread > 0) { var jt = Impact.nodeJit[i], sp = Impact.spread; v.set(nv[0] * (1 + jt[3] * sp) + jt[0] * sp, nv[1] * (1 + jt[3] * sp) + jt[1] * sp, nv[2] * (1 + jt[3] * sp) + jt[2] * sp); }
      v.applyQuaternion(this.globe.quaternion);
      var depth = v.z; // +1 kameraya en yakın
      if (depth > best) { best = depth; bestI = i; }
      var sv = v.clone().project(this.camera);
      var x = (sv.x * 0.5 + 0.5) * w, y = (-sv.y * 0.5 + 0.5) * h;
      var f = Math.max(0, Math.min(1, (depth + 1) / 2));
      var sc = 0.72 + 0.5 * f;
      var op = depth < 0 ? 0.35 : 0.55 + 0.45 * f;
      if (Orbit.off.length) {
        Orbit.home[i].x = x; Orbit.home[i].y = y;
        var oo = Orbit.off[i];
        if (Orbit.phase === 'chaos' || (Orbit.idx === i && Orbit.phase !== 'idle' && Orbit.phase !== 'hold')) {
          x += oo.x; y += oo.y; sc = Orbit.idx === i && Orbit.phase === 'grab' ? 1.3 : 1; op = 1; depth = Math.max(depth, 0.01);
          f = 1;
        }
      }
      var el = this.nodeEls[i];
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = op.toFixed(2);
      el.style.zIndex = String(Math.round(f * 100));
      el.classList.toggle('back', depth < 0 || Impact.spread > 0.05);
    }
    // Öndeki düğüm merkezdeki sayıların üstüne gelince sayılar soluklaşır
    if (bestI >= 0) {
      var fv = this.nodeVecs[bestI];
      v.set(fv[0], fv[1], fv[2]).applyQuaternion(this.globe.quaternion).project(this.camera);
      var dist = Math.hypot(v.x * 0.5 * w, v.y * 0.5 * h);
      var cs = this.centerEl || (this.centerEl = document.getElementById('center-stats'));
      var o = Math.max(0.15, Math.min(1, (dist - 40) / 60)).toFixed(2);
      if (cs.style.opacity !== o) cs.style.opacity = o;
    }
    if (bestI !== this.frontIdx) {
      if (this.frontIdx >= 0) this.nodeEls[this.frontIdx].classList.remove('front');
      this.frontIdx = bestI;
      if (bestI >= 0) this.nodeEls[bestI].classList.add('front');
    }
  },

  ease: function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  // Düğümü öne getir + kamera yaklaşır (450 ms)
  focus: function (idx) {
    var self = this;
    if (!this.ok) return Promise.resolve();
    var T = THREE;
    var q0 = this.globe.quaternion.clone();
    var nv = this.nodeVecs[idx];
    var vw = new T.Vector3(nv[0], nv[1], nv[2]).applyQuaternion(q0).normalize();
    var qd = new T.Quaternion().setFromUnitVectors(vw, new T.Vector3(0, 0, 1));
    var q1 = qd.multiply(q0);
    this.vx = this.vy = 0;
    return new Promise(function (resolve) {
      self.anim = { t0: performance.now(), dur: 450, q0: q0, q1: q1, z0: self.camZ, z1: self.baseZ * 0.72, done: resolve };
      self.start();
    });
  },
  unfocus: function () {
    var self = this;
    if (!this.ok) return Promise.resolve();
    if (this.pendingResize) this.resize();
    var q = this.globe.quaternion.clone();
    this.lastInput = performance.now();
    return new Promise(function (resolve) {
      self.anim = { t0: performance.now(), dur: 450, q0: q, q1: q, z0: self.camZ, z1: self.baseZ, done: resolve };
      self.start();
    });
  },
  stepAnim: function (now) {
    var a = this.anim, k = Math.min(1, (now - a.t0) / a.dur), e = this.ease(k);
    this.globe.quaternion.copy(a.q0).slerp(a.q1, e);
    this.camZ = a.z0 + (a.z1 - a.z0) * e;
    this.camera.position.z = this.camZ;
    if (k >= 1) { this.anim = null; a.done(); }
  }
};

/* ---------- Asteroit olayı ----------
   Küre ekranında her 30 saniyede bir: üstte kırmızı uyarı + 3'ten geri sayım
   ve "Roket Gönder" düğmesi. Roket gönderilirse asteroit çarpmadan parçalanır,
   parçalar etrafa saçılıp kaybolur. Gönderilmezse asteroit çarpar, küre
   dağılır ve 3 saniye sonra geri toparlanır. Ayarlardan kapatılabilir. */
var Impact = {
  INTERVAL: 30, WARN: 3,
  phase: 'idle', // idle | warn | rocket | boom | scatter | gather
  t: 0, wait: 30, spread: 0, nodeJit: [],
  ast: null, rocket: null, frags: [], shards: [], target: null, dir: null, start: null, prog: 0,
  el: null,
  init: function () {
    var el = document.createElement('div');
    el.id = 'impact-alert';
    el.className = 'hidden';
    el.innerHTML = '<div class="ia-box"><span class="ia-ic">' + icon('alert', 22) + '</span><b class="hud" data-ia-text>Asteroit yaklaşıyor</b><span class="ia-count hud" data-ia-count>3</span></div>' +
      '<button class="btn ia-rocket" data-act="rocket">' + icon('rocket', 22) + ' Roket Gönder</button>';
    document.getElementById('stage').appendChild(el);
    this.el = el;
    Actions.rocket = function () { Impact.launch(); };
    this.wait = this.INTERVAL;
    for (var i = 0; i < NODES.length; i++) this.nodeJit.push([Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1, 1.6 + Math.random() * 1.4]);
  },
  active: function () { return this.phase !== 'idle'; },
  pal: function () {
    var light = Settings.theme === 'light';
    return { light: light, cy: light ? 0x00739e : 0x00e5ff, am: light ? 0xd96f00 : 0xffb300, rock: light ? 0x4a5f75 : 0x0f1b33, blend: light ? THREE.NormalBlending : THREE.AdditiveBlending };
  },
  update: function (dt) {
    if (!Sphere.ok || !this.el) return;
    if (this.phase === 'idle') {
      if (!Settings.asteroid || REDUCED || UI.panelOpen() || document.hidden || Orbit.phase !== 'idle') return;
      this.wait -= dt;
      if (this.wait <= 0) this.begin();
      return;
    }
    this.t += dt;
    var T = THREE;
    if (this.phase === 'warn') {
      var left = this.WARN - this.t;
      var n = Math.max(1, Math.ceil(left));
      if (n !== this.lastCount) { this.lastCount = n; this.el.querySelector('[data-ia-count]').textContent = String(n); this.beep(); }
      this.prog = Math.min(1, this.t / this.WARN);
      this.placeAsteroid(this.prog * this.prog);
      if (left <= 0) this.impact();
    } else if (this.phase === 'rocket') {
      // Asteroit yavaşlar, roket onu kovalar
      this.prog = Math.min(0.97, this.prog + dt / this.WARN * 0.2);
      this.placeAsteroid(this.prog * this.prog);
      var rp = this.rocket.position, ap = this.ast.position;
      var to = ap.clone().sub(rp), d = to.length();
      var step = Math.min(d, (2.2 + this.t * 6) * dt);
      rp.add(to.normalize().multiplyScalar(step));
      this.rocket.lookAt(ap); this.rocket.rotateX(Math.PI / 2);
      this.trail(rp, this.pal().am, 2);
      if (d < 0.12) this.destroyAsteroid();
    } else if (this.phase === 'boom') {
      if (this.t > 1.6) this.finish('Asteroit yok edildi');
    } else if (this.phase === 'scatter') {
      // 3 sn boyunca sürekli hareket: parçalar yavaşça açılır ve hiç durmadan geri birleşir
      var u = Math.min(1, this.t / 3), f = Math.pow(Math.sin(Math.PI * u), 0.9);
      this.spread = f;
      this.globeScale(1 - 0.85 * f);
      var sw = this.t * 1.6;
      this.shards.forEach(function (sh) {
        var d = sh.dist * f;
        sh.mesh.position.copy(sh.home).addScaledVector(sh.dir, d);
        sh.mesh.position.x += Math.sin(sw + sh.ph) * 0.15 * f; sh.mesh.position.y += Math.cos(sw + sh.ph) * 0.15 * f;
        sh.mesh.rotation.x += sh.rx * dt; sh.mesh.rotation.y += sh.ry * dt;
        sh.mesh.material.opacity = 0.35 + 0.65 * f;
      });
      if (u > 0.5 && !this.gatherMsg) { this.gatherMsg = true; this.el.querySelector('[data-ia-text]').textContent = 'Küre toparlanıyor'; }
      if (u >= 1) { this.clearShards(); this.globeScale(1); this.spread = 0; this.finish(''); }
    }
    // Saçılan parçalar
    var self = this;
    this.frags = this.frags.filter(function (f) {
      f.life -= dt;
      if (f.home) return true; // küre parçaları ayrıca yönetilir
      f.mesh.position.addScaledVector(f.v, dt);
      f.v.multiplyScalar(0.985);
      f.mesh.rotation.x += f.rx * dt; f.mesh.rotation.y += f.ry * dt;
      f.mesh.material.opacity = Math.max(0, f.life / f.max);
      if (f.life <= 0) { Sphere.scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); return false; }
      return true;
    });
  },
  begin: function () {
    var T = THREE, P = this.pal();
    this.phase = 'warn'; this.t = 0; this.lastCount = 0; this.prog = 0;
    // Hedef: kameraya dönük yarıküreden rastgele bir nokta; asteroit üst-yan uzaktan gelir
    var a = Math.random() * Math.PI * 2;
    this.target = new T.Vector3(Math.cos(a) * 0.55, 0.45 + Math.random() * 0.35, 0.6).normalize();
    this.start = new T.Vector3(Math.cos(a) * 2.4, 2.5, -0.5 + Math.random());
    var geo = new T.IcosahedronGeometry(0.17, 1), pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var f = 0.8 + Math.random() * 0.4;
      pos.setXYZ(i, pos.getX(i) * f, pos.getY(i) * f, pos.getZ(i) * f);
    }
    geo.computeVertexNormals();
    this.ast = new T.Group();
    this.ast.add(new T.Mesh(geo, new T.MeshBasicMaterial({ color: P.rock })));
    this.ast.add(new T.Mesh(geo, new T.MeshBasicMaterial({ color: P.am, wireframe: true, transparent: true, opacity: 0.9 })));
    Sphere.scene.add(this.ast);
    this.placeAsteroid(0);
    this.el.querySelector('[data-ia-text]').textContent = 'Asteroit yaklaşıyor';
    this.el.querySelector('[data-ia-count]').textContent = '3';
    this.el.querySelector('[data-ia-count]').classList.remove('hidden');
    this.el.querySelector('.ia-rocket').classList.remove('hidden');
    this.el.classList.remove('hidden', 'ok');
    document.body.classList.add('impact');
    Fx.reset();
    haptic(30);
  },
  placeAsteroid: function (k) {
    if (!this.ast) return;
    this.ast.position.lerpVectors(this.start, this.target, k);
    this.ast.rotation.x += 0.05; this.ast.rotation.y += 0.03;
    this.trail(this.ast.position, this.pal().am, 1);
  },
  // Kuyruk / iz parçacığı
  trail: function (p, color, n) {
    var T = THREE, P = this.pal();
    for (var i = 0; i < n; i++) {
      var m = new T.Mesh(new T.SphereGeometry(0.02 + Math.random() * 0.02, 6, 4), new T.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8, blending: P.blend, depthWrite: false }));
      m.position.copy(p).add(new T.Vector3((Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.06));
      Sphere.scene.add(m);
      this.frags.push({ mesh: m, v: new T.Vector3(), rx: 0, ry: 0, life: 0.35, max: 0.35 });
    }
  },
  launch: function () {
    if (this.phase !== 'warn') return;
    var T = THREE, P = this.pal();
    this.phase = 'rocket'; this.t = 0;
    var g = new T.Group();
    var body = new T.Mesh(new T.ConeGeometry(0.035, 0.16, 10), new T.MeshBasicMaterial({ color: P.cy }));
    g.add(body);
    var fin = new T.Mesh(new T.CylinderGeometry(0.03, 0.045, 0.04, 10), new T.MeshBasicMaterial({ color: P.am }));
    fin.position.y = -0.09; g.add(fin);
    var launchFrom = this.target.clone().multiplyScalar(1.05);
    g.position.copy(launchFrom);
    Sphere.scene.add(g);
    this.rocket = g;
    this.el.querySelector('[data-ia-text]').textContent = 'Roket yolda';
    this.el.querySelector('[data-ia-count]').classList.add('hidden');
    this.el.querySelector('.ia-rocket').classList.add('hidden');
    Sound.play('open');
    if (Sound.ctx && Settings.sound) { try { Sound.tone(220, 0.5, 'sawtooth', 0, 900); } catch (e) {} }
    haptic(20);
  },
  burst: function (at, colors, n, speed, size) {
    var T = THREE, P = this.pal();
    for (var i = 0; i < n; i++) {
      var s = size * (0.5 + Math.random());
      var m = new T.Mesh(new T.TetrahedronGeometry(s, 0), new T.MeshBasicMaterial({ color: colors[i % colors.length], transparent: true, opacity: 1, blending: P.blend, depthWrite: false }));
      m.position.copy(at);
      var v = new T.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().multiplyScalar(speed * (0.4 + Math.random()));
      Sphere.scene.add(m);
      var life = 1.0 + Math.random() * 0.6;
      this.frags.push({ mesh: m, v: v, rx: Math.random() * 8, ry: Math.random() * 8, life: life, max: life });
    }
  },
  destroyAsteroid: function () {
    var P = this.pal(), at = this.ast.position.clone();
    this.burst(at, [P.am, P.rock, P.cy], 46, 1.8, 0.035);
    this.flash(at, 0.9);
    this.removeObj('ast'); this.removeObj('rocket');
    this.phase = 'boom'; this.t = 0;
    this.el.querySelector('[data-ia-text]').textContent = 'Asteroit yok edildi';
    this.el.classList.add('ok');
    this.boomSound(0.6);
    fb('ok'); haptic(40);
  },
  impact: function () {
    var T = THREE, P = this.pal(), at = this.target.clone();
    this.removeObj('ast');
    this.flash(at, 1.4);
    this.burst(at, [P.am, P.cy], 30, 2.4, 0.04);
    // Küre parçaları: yüzeyden dışarı saçılır, sonra geri döner
    for (var i = 0; i < 70; i++) {
