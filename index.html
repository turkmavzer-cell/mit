      /* Custom scrollbar for a more modern look */

      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; /* bg-gray-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280; /* bg-gray-500 */
      }
      .leaflet-container {
        height: 100%;
        width: 100%;
      }

      /* Print styles for Manufacturing Slip */
      @media print {
        body * {
          visibility: hidden;
        }
        .printable-area, .printable-area * {
          visibility: visible;
        }
        .printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 20px;
          font-size: 12px;
          color: #000;
          background: #fff;
        }
        .no-print, .no-print * {
          display: none !important;
        }
        @page {
          size: A4;
          margin: 1cm;
        }
      }
    </style>
